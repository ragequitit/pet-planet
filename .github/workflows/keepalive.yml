# .github/workflows/keepalive.yml
# Keeps the Supabase project "flip-the-switch" (ref sclmvswoqebrwowerorh) awake by
# making a real API request every few days, so it isn't auto-paused for inactivity.
#
# Drop this file at:  .github/workflows/keepalive.yml  in your game repo, commit & push.
# Then test it once by hand: repo -> Actions -> "Supabase keepalive" -> "Run workflow".
#
# KEY: this uses the project's PUBLISHABLE key (sb_publishable_...). It's designed to be
# public and already ships in the browser game, so it's safe to keep here. (The old legacy
# anon JWT is rejected by this project's API gateway with 401 — that's why v1 failed.)
# Prefer a secret? Create repo secret SUPABASE_KEY and change the env line to:
#   SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

name: Supabase keepalive

on:
  schedule:
    # 06:17 UTC every 3rd day-of-month (worst-case gap stays well under the ~7-day pause window).
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: "https://sclmvswoqebrwowerorh.supabase.co"
      SUPABASE_KEY: "sb_publishable_sgAPY3rfqubK02sNL6gaFQ_0tzzn5Wo"
    steps:
      - name: Ping Supabase (keeps the project active)
        run: |
          set -uo pipefail
          base="${SUPABASE_URL%/}"
          hit () {
            curl -sS -m 30 -o /dev/null -w '%{http_code}' \
              -H "apikey: ${SUPABASE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_KEY}" \
              "$1" || echo "000"
          }
          c1=""; c2=""; ok=0
          for attempt in 1 2 3; do
            c1="$(hit "$base/rest/v1/")"
            echo "Attempt ${attempt}: GET /rest/v1/ -> ${c1}"
            case "$c1" in 2??) echo "OK via REST"; ok=1; break;; esac
            c2="$(hit "$base/auth/v1/health")"
            echo "Attempt ${attempt}: GET /auth/v1/health -> ${c2}"
            case "$c2" in 2??) echo "OK via auth health"; ok=1; break;; esac
            sleep 10
          done
          if [ "$ok" = "1" ]; then
            echo "Activity registered at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            exit 0
          fi
          echo "::error::Keepalive ping failed (REST=${c1:-none}, health=${c2:-none}). Check the key, or un-pause the project from the dashboard first."
          exit 1
