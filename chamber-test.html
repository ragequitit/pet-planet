<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
body{margin:0;background:#050810;font-family:-apple-system,system-ui,sans-serif;}
@keyframes sheetUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.muted{color:#94a3b8;}.small{font-size:12px;}
.mapsheet-x{background:none;border:none;color:#94a3b8;font-size:24px;cursor:pointer;}
.tp-overlay { position:fixed; inset:0; z-index:80; background:rgba(2,4,10,.9);
  display:flex; align-items:center; justify-content:center; padding:16px; animation:sheetUp .16s ease-out; }
.tp-chamber { width:100%; max-width:480px; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,#0c1730,#070c18); border:1px solid #24406e; border-radius:20px;
  padding:18px 16px; box-shadow:0 24px 70px rgba(0,0,0,.75); }
.tp-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
.tp-title { font-weight:800; font-size:20px; letter-spacing:.02em; color:#dbeafe;
  text-shadow:0 0 18px rgba(56,189,248,.4); }
.tp-list { display:flex; flex-direction:column; gap:8px; }
.tp-srv { border:1px solid #1c2c4c; border-radius:14px; overflow:hidden; background:#0a1424; }
.tp-srv-row { display:flex; align-items:stretch; gap:11px; padding:10px; cursor:pointer; }
.tp-srv-row:active { background:#0e1a30; }
.tp-srv-here { border:1px solid #38bdf855; border-radius:12px; background:#0d1c34; }
.tp-thumb { flex:0 0 62px; width:62px; height:62px; border-radius:10px; display:grid; place-items:center;
  overflow:hidden; }
.tp-thumb-glyph { font-size:26px; font-weight:800; opacity:.9; text-shadow:0 1px 6px rgba(0,0,0,.6); }
.tp-srv-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; justify-content:center; }
.tp-srv-name { font-weight:800; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tp-srv-type { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#64748b; }
.tp-srv-desc { overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.tp-srv-action { flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:4px; min-width:96px; }
.tp-cost { font-weight:800; font-size:14px; font-variant-numeric:tabular-nums; }
.tp-btn { border-radius:9px; padding:8px 14px; font-weight:800; font-size:12.5px; letter-spacing:.04em;
  border:1px solid; cursor:pointer; width:100%; }
.tp-btn-go { background:#16a34a2e; border-color:#22c55e; color:#4ade80; }
.tp-btn-go:active { background:#16a34a4a; }
.tp-btn-lock { background:#7f1d1d1f; border-color:#b91c1c66; color:#fb7185; cursor:default; }
.tp-lock-note { font-size:9.5px; color:#fb7185; font-weight:700; }
.tp-here-tag { font-size:11px; font-weight:800; letter-spacing:.06em; color:#7dd3fc; border:1px solid #38bdf855;
  border-radius:8px; padding:6px 10px; }
.tp-drives { border-top:1px solid #1c2c4c; background:#070f1e; padding:6px; display:flex; flex-direction:column; gap:5px; }
.tp-drive-row { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:9px; background:#0b1626; }
.tp-dot { flex:0 0 9px; width:9px; height:9px; border-radius:50%; }
.tp-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px;
  padding-top:12px; border-top:1px solid #1c2c4c; font-size:13px; }
</style></head><body>
<div class="tp-overlay">
  <div class="tp-chamber">
    <div class="tp-head">
      <div><div class="tp-title">Teleportation Chamber</div>
      <div class="muted small">Travel instantly to any unlocked Server or Drive.</div></div>
      <button class="mapsheet-x">&times;</button>
    </div>
    <div class="tp-list">
      <div class="tp-srv"><div class="tp-srv-row tp-srv-here">
        <span class="tp-thumb" style="background:linear-gradient(140deg,#a855f7cc,#a855f722 70%,#0a0f1f)"><span class="tp-thumb-glyph">N</span></span>
        <span class="tp-srv-main"><span class="tp-srv-name" style="color:#a855f7">Neon Hub</span><span class="tp-srv-type">Starter Server</span><span class="muted small tp-srv-desc">The central hub of The Network.</span></span>
        <span class="tp-srv-action"><span class="tp-here-tag">CURRENT</span></span>
      </div></div>
      <div class="tp-srv"><div class="tp-srv-row">
        <span class="tp-thumb" style="background:linear-gradient(140deg,#34d399cc,#34d39922 70%,#0a0f1f)"><span class="tp-thumb-glyph">C</span></span>
        <span class="tp-srv-main"><span class="tp-srv-name" style="color:#34d399">Cold Storage</span><span class="tp-srv-type">Near Sector</span><span class="muted small tp-srv-desc">A cold place.</span></span>
        <span class="tp-srv-action"><span class="tp-cost" style="color:#4ade80">120 &#9671;</span><button class="tp-btn tp-btn-go">TELEPORT</button></span>
      </div></div>
    </div>
    <div class="tp-foot"><span><b style="color:#4ade80">1,050</b> Credits</span><span class="muted small">Instant · costs Credits</span></div>
  </div>
</div>
</body></html>
