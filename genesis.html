<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070f">
<title>GENESIS v0.16.0</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#05070f; overscroll-behavior:none; }
  body { -webkit-text-size-adjust:100%; }
  #root { height:100%; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          color:#7dd3fc; font:600 14px/1.6 ui-sans-serif,system-ui,sans-serif; letter-spacing:.14em;
          text-align:center; padding:24px; background:#05070f; }
  #boot.err { color:#fb7185; letter-spacing:0; font-weight:500; white-space:pre-wrap; text-align:left; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot">ENTERING GENESIS…</div>
<script>
/* ---------------------------------------------------------------------------
   HOST SHIM. The game talks to persistent storage through window.storage — the
   API the Claude artifact host provides. Outside the artifact nothing provides
   it, so the PAGE does, backed by localStorage. The game file is unchanged and
   contains no localStorage of its own; the host owns the host's job.
   Same async shape: get -> {key,value,shared}|null, set, delete, list.
   --------------------------------------------------------------------------- */
(function () {
  var PREFIX = "genesis:";
  function ok(v) { return Promise.resolve(v); }
  window.storage = {
    get: function (key) {
      try { var v = localStorage.getItem(PREFIX + key);
            return ok(v === null ? null : { key: key, value: v, shared: false }); }
      catch (e) { return ok(null); }
    },
    set: function (key, value) {
      try { localStorage.setItem(PREFIX + key, String(value));
            return ok({ key: key, value: String(value), shared: false }); }
      catch (e) { return Promise.reject(e); }
    },
    delete: function (key) {
      try { localStorage.removeItem(PREFIX + key); return ok({ key: key, deleted: true, shared: false }); }
      catch (e) { return ok({ key: key, deleted: false, shared: false }); }
    },
    list: function (prefix) {
      try {
        var keys = [], p = PREFIX + (prefix || "");
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(p) === 0) keys.push(k.slice(PREFIX.length));
        }
        return ok({ keys: keys, prefix: prefix || "", shared: false });
      } catch (e) { return ok({ keys: [] }); }
    }
  };
  /* Surface a boot failure instead of a white screen. */
  window.addEventListener("error", function (e) {
    var b = document.getElementById("boot");
    if (b) { b.className = "err"; b.textContent = "GENESIS failed to start:\n\n" + (e.message || e) + "\n\n" + ((e.error && e.error.stack) || ""); }
  });
})();
</script>

<script>var GenesisBundle=(()=>{var Cs=Object.defineProperty;var so=Object.getOwnPropertyDescriptor;var ro=Object.getOwnPropertyNames;var ao=Object.prototype.hasOwnProperty;var oo=(t,s)=>{for(var a in s)Cs(t,a,{get:s[a],enumerable:!0})},no=(t,s,a,r)=>{if(s&&typeof s=="object"||typeof s=="function")for(let o of ro(s))!ao.call(t,o)&&o!==a&&Cs(t,o,{get:()=>s[o],enumerable:!(r=so(s,o))||r.enumerable});return t};var io=t=>no(Cs({},"__esModule",{value:!0}),t);var ol={};oo(ol,{default:()=>to});var Ge=window.React,e=Ge,W=Ge.useState,le=Ge.useEffect,oe=Ge.useRef,Te=Ge.useCallback,Ss=Ge.useMemo,Es=Ge.createContext,Rt=Ge.useContext,il=Ge.memo,ll=Ge.Fragment,dl=Ge.Component,cl=Ge.createElement;var dt={projectName:"PROJECT GENESIS",prototypeVersion:"0.16.0",phase:"Phase 10 \u2014 RECYCLE: the collection is yours to keep",saveVersion:12,finalTestCount:782,completedSystems:[`PHASE 14 \u2014 CHARACTERS AND CLASSES (v0.16.0). One account now holds many characters, MMO style: the class is chosen once at creation and never changed, and wanting a different one means rolling another Explorer. NAMING follows the Diablo model the owner chose \u2014 the ACCOUNT handle is unique across GENESIS (unique index on lower(display_name)), while character names are NOT globally unique, because unique character names means the good ones are gone in a week and every latecomer plays as Nyx4471. One account may not hold two identically-named Explorers, which is a roster-clarity rule, not an identity one. THE FIVE CLASSES, and the two rules that shaped them: Breaker (tap 1.18, crit 1.5), Weaver (production 1.15, offline 1.25), Salvager (luck 1.3, fragments 1.2), Keeper (echoXp 1.25, capsuleCost 0.85), Drifter (travelCost 0.75, transitSpeed 0.85, scanCost 0.8). RULE ONE: no two classes are measured in the same unit \u2014 Breaker changes tapping, Weaver idling, Salvager what drops, Keeper Echoes, Drifter moving \u2014 because the moment two classes both read "+X% Data" one of them is simply worse and everyone picks the other. test15 asserts no two classes share a modifier SHAPE, and that each class is beaten on some axis by another, so there is no strict winner. RULE TWO: no class earns more CREDITS. Credits are the auction-house currency, so a class that earns more of them prints money relative to every other player \u2014 that is an economy lever, not a personal perk. Asserted, not just intended. classMods(g) returns the same shape as the planet-perk set and slots into the SAME computeStats stack (eMods * perm * evt * cm * pm * clm), which is why five classes cost almost no new plumbing \u2014 the Phase 12 decision to make perks reuse existing modifier surfaces paid for itself again. travelCost lands inside hopCost, the ONE function that prices a hop, so preview, pathfinder and actual spend can never disagree. An unknown class id is inert rather than fatal, so an older client meeting a newer character degrades instead of crashing. STRUCTURE: App -> Boundary -> AuthGate -> CharacterGate -> ActiveGame -> GameProvider(key=characterId) -> Shell. The gates now sit OUTSIDE GameProvider because the character decides WHICH save to load; the key remounts the provider on switch, which is the cheapest possible guarantee that one character's state cannot bleed into another's. One save per character (SAVE_KEY + "." + id), and boot stamps the SERVER's name and class onto the save rather than trusting what is stored. SERVER: characters table (RLS select/delete own, and deliberately NO insert policy), a private name_blocklist table, fold_name() collapsing digit-for-letter swaps so 4dmin lands on admin, name_is_blocked(), and create_character() as the only door in \u2014 which is what lets the name shape, the blocklist and a ten-character cap live in one place a client cannot route around. Verified against the real database: 4dmin, M0derator and GenesisGM blocked, Nyx and Vex99 allowed. The blocklist targets IMPERSONATION above all, because in a game with player-to-player trading an "Admin" can talk somebody out of a real item. SECURITY FIX FOUND WHILE CHECKING RATHER THAN ASSUMING: Supabase grants EXECUTE on new public functions to anon by default, so the initial revoke-from-public left anon holding a grant, and revoking from anon alone did nothing while PUBLIC still held it. create_character already refused a null auth.uid(), but name_is_blocked() would have let an anonymous caller brute-force the blocklist one guess at a time \u2014 the exact thing keeping the list unreadable was meant to prevent. All three functions are authenticated-only now, confirmed by has_function_privilege. BUG FIXED, AND IT WAS MINE: the v0.14.8 deepMerge hardening was wrong, because typeof null === "object" \u2014 a default of null fell into the object branch and the stored value was silently discarded, so a character's saved NAME always came back null. The pre-0.14.8 code crashed in the same spot; my fix turned a crash into quiet data loss, which is the worse of the two. A null default is a LEAF meaning "nothing chosen yet", so the stored value wins. Caught by test15, not by reading. TESTING NOTE: test15 measures production on a rig with actual buildings, because a fresh player has dps 0 and every ratio against it is 0/0 \u2014 the first version of the suite reported NaN and looked like a code bug. testgate now unmounts old roots between sections; a stale tree stayed subscribed to AuthAPI, re-fetched its roster when a later section signed in, and stole scripted responses from the root under test. Tests: test15 (63) new, testgate (19) extended through the roster, 275 assertions green overall plus mount and the hosted-page load. STILL OPEN: create_character() has never been called by a real browser session \u2014 only by admin SQL \u2014 so the owner running it on the phone is the actual proof. NOT BUILT YET, on purpose: appearance, and every PvP hook (each class records its pvpLater fantasy as documentation, because a class whose perk does not work yet is just a worse class).`,`PHASE 13 \u2014 THE DOOR (v0.15.0). GENESIS now requires an account to play. The owner made this call after the sign-in was buried at Family -> Market and he could not find it \u2014 but the reason it went in the doorway rather than just somewhere visible is the anti-dupe design. If someone could play signed out for twenty hours and only then create an account, we would have to either refuse to let them ever trade anything they had earned, or upload assets the server never minted \u2014 and the second option makes the three-layer protection worthless the day anyone edits their own storage. Requiring the account from the first tap means a second, untrusted universe of assets can never exist. Nothing needed migrating: the game is not released and nobody had played offline yet. STRUCTURE: App -> Boundary -> GameProvider -> AuthGate -> Shell. AuthGate resumes a stored session FIRST and shows the connecting splash while it does, so a returning Explorer never sees the door flash before their own Hub; then it renders either AuthScreen or the game, and it re-decides on every AuthAPI change, so signing out drops you back to the door immediately. AuthForm is shared by the door and the Market header so the two can never drift apart. AuthAPI.restore() is now guarded against parallel callers \u2014 two restores would fire two refreshes and one of the two new tokens would be silently discarded. UX detail that matters on a phone: a blocked host and a wrong password are completely different problems, so a fetch TypeError is detected and explained ("GENESIS cannot reach the Network from here \u2014 open the hosted page") instead of being shown as a login failure. The door scrolls, because the iOS keyboard eats half the screen, and every input is 16px, because anything smaller makes Safari zoom the page on focus. CONSEQUENCE, ACCEPTED ON PURPOSE: the game is no longer playable inside the Claude artifact viewer, which blocks supabase.co. The hosted page IS the game now. TESTING LESSON WORTH KEEPING: adding the gate silently blinded the full-App mount test \u2014 renderToStaticMarkup never runs useEffect, so App now renders only the gate's checking splash, and the 96k of markup it reports is almost entirely the inlined stylesheet. New testgate.cjs mounts the app for real through jsdom + react-dom/client with effects running, and drives all five states: door when signed out, game after signing in, back to the door on sign out, no door at all for a resumed session, and the blocked-host message. It also caught a false positive worth remembering \u2014 App inlines the entire stylesheet, so every CSS class name appears in innerHTML as text; strip <style> before asking whether something rendered.`,"PHASE 13 \u2014 AUTH + THE HOSTED PAGE (v0.14.9). MEASURED, NOT ASSUMED: the artifact sandbox really does block supabase.co (fetch threw 'Load failed' in 3ms \u2014 a refusal, not a timeout), and the same build served from GitHub Pages answered HTTP 200 in 224ms with an empty array. The empty array is RLS working correctly, not a fault: every policy on this database is authenticated-only, so an anonymous key is supposed to see nothing. GENESIS therefore ships as a single self-contained genesis.html (React + ReactDOM + the game inlined, zero external requests) with the host page providing window.storage over localStorage \u2014 the game file itself still contains no localStorage, because storage is the HOST's job and that keeps the same .jsx running in the artifact. A side effect that matters: on the hosted page progress actually persists across sessions for the first time. NEW: AuthAPI, the second and last seam to the outside world, hand-rolled over fetch() rather than @supabase/supabase-js (an npm import would not resolve in the artifact viewer, and GoTrue is four REST endpoints). It owns signUp / signIn / signOut / refresh / restore / authedFetch / loadPlayer, persists the session under genesis.auth.v1 via SaveAdapter, resumes it at boot AFTER the game has started (never blocking play), refreshes an expired token once on a 401 and retries, and signs you out cleanly rather than looping if the refresh also fails. Sign-up passes an optional Explorer name as user metadata, which the server's handle_new_user() trigger reads to create the public.players row \u2014 leave it blank and the server names you Explorer-xxxxxx. The name is capped at 24 characters. UI: AuthPanel at the top of the Market (the only screen that needs a server; everything else plays identically signed out), sign-in / create-account toggle, the server's own error wording surfaced verbatim, and a CONNECTED header showing your name and the SERVER's Credit balance \u2014 which is the authoritative one for anything tradeable. Tests: test14 (45) drives every path against a scripted GoTrue, including that the password is never persisted, that an authed call while signed out never touches the network, and that corrupt stored auth resolves to signed-out instead of throwing at boot. teststatic now enforces that no fetch() exists outside the seam. testhost loads the built page in a real DOM and mounts it. STILL MOCK: MarketAPI.live is still false. KNOWN GAP BEFORE IT CAN FLIP \u2014 browse cannot work yet: players_select_own, echoes_select_own and items_select_own mean a signed-in client can read only its OWN rows, so it can see neither another Explorer's display name nor the asset they are selling. That needs one server-side browse function returning listing + seller name + asset snapshot. That is the next build, and it is a database change.","SAVE ROBUSTNESS (v0.14.8) \u2014 deepMerge crashed on an object/scalar mismatch. If a stored save held a primitive (or an array) where the default state holds an object \u2014 say items: 12 after a truncated or hand-edited save \u2014 the merge hit `k in incoming` on a primitive and threw a TypeError. That aborted the whole load, and the boot handler's catch then discarded the ENTIRE save and started a fresh Network over one bad field, which is the worst possible outcome for a player. deepMerge now returns the default branch when the incoming value is not a plain object, exactly as the primitive branch already did on a type mismatch, so every other field survives. Found by the rebuilt test rig (testsanity), not by the eye. The two callers are boot (SaveAdapter.read) and Settings -> import save; both are now non-fatal for a partially damaged save. No save-version change, no behaviour change for a healthy save.","PHASE 13 (CONNECTIVITY PROBE, v0.14.7) \u2014 we stopped GUESSING whether the current host can reach supabase.co. The notes assumed the artifact sandbox blocks outbound network calls (the same restriction that makes localStorage unavailable), but it was never measured. Added module-scope SUPABASE_URL + SUPABASE_KEY (the publishable key only \u2014 safe in the browser; the service_role key must never live here) and a diagnostic-only async pingSupabase(): it makes ONE real GET to /rest/v1/economy_config (apikey header, 8s AbortController timeout, no auth, no writes, no state touched) and reports what actually happened \u2014 fetch RESOLVING with any HTTP status means the network is OPEN (server answered), fetch THROWING means it's BLOCKED by the host. Surfaced as a 'Ping Supabase' button in the debug panel (Phase 13 \u2014 Supabase connectivity) that shows NETWORK OPEN (HTTP status + latency + body snippet) or NETWORK BLOCKED (the error) inline. Never shipped (debug-panel only). This is the load-bearing unblock for Phase 13: if the artifact can reach Supabase we may flip live=true WITHOUT hosting; if not, hosting is confirmed-required. Owner is on vacation and wants to keep building on the artifact \u2014 this measures whether that path is even blocked. Mount clean; sanity + logic bundle green. No save change.","PHASE 13 (MULTIPLAYER / AUCTION HOUSE \u2014 the backend is real, v0.14.0 \u2192 v0.14.5) \u2014 GENESIS now has a server. A Supabase project (ref lbssixfkqoqvpapprpab, eu-north-1, Postgres 17) is live with a 7-table schema and RLS on everything: players (Credits live here, server-authoritative), saves (the local idle sim as JSONB), echoes, items, listings, ledger (append-only audit), economy_config (5% fee, max 10 active listings, price bounds). THE ANTI-DUPE DESIGN, three layers: (1) echoes/items are SELECT-only from the client \u2014 there are deliberately NO insert/update/delete policies, so an Echo exists only because the SERVER minted the row; (2) a players_guard trigger raises if a normal UPDATE touches credits or banned, so only SECURITY DEFINER functions move money; (3) trading is ATOMIC \u2014 buy_listing() locks the listing and the buyer's row, moves Credits AND ownership in one transaction and writes both sides to the ledger, plus a unique partial index makes a double-listing impossible at the database level even under perfectly-timed concurrent requests. Server functions are the only way anything moves: list_asset / buy_listing / cancel_listing, authenticated-only. AGREED SPLIT (an idle game cannot round-trip 8 taps/sec): taps/Data/buildings stay LOCAL (cheating there only hurts your own save), while everything TRADEABLE or rare \u2014 capsule rolls, loot, Credits, auctions \u2014 becomes server-authoritative; offline idle still works, trading requires online. THE UI IS BUILT AND PLAYABLE at Family \u2192 Market: Browse / Sell / My listings, a Credits wallet, tap-a-listing detail (kind tag ECHO/GEAR, rarity, abilities for pets or Combat Power/ilvl/band for gear), a buy CONFIRMATION, and listing an asset REMOVES it from your inventory/sell picker/forge until sold or cancelled (mirrors echoes.locked). Buying delivers for real via the new marketReceive() store action (checks Credits, deducts, registerEcho with a fresh id or unshift into items.inventory, toasts) \u2014 verified end-to-end through the real store. ARCHITECTURE THAT MATTERS: MarketAPI is the ONLY thing that talks outward (browse/myListings/list/cancel/buy/isListed) and currently serves deterministic MOCK data with live=false; when the game is hosted where it can reach supabase.co, ONLY those five function bodies change to supabase.rpc(...) \u2014 the screens do not change, because the DB contract already matches. REMAINING: hosting (the artifact sandbox almost certainly blocks supabase.co \u2014 Phase 13 is effectively the move out of the artifact viewer), auth UI, flip live=true, cloud save + migration, then server-side minting of tradeable assets.","PHASE 12.9 (THE WORLD IS NAMED \u2014 vocabulary locked, v0.13.40) \u2014 the fiction had two metaphors fighting each other (space vs computer network) and a player could not tell which world they were in. Resolved by making the NETWORK the real world and space merely how it LOOKS: you are jacked into GENESIS (OASIS-style), and the starfield is how the Network renders itself. The hierarchy is now GENESIS > The Network > SERVERS (which you travel between) > DRIVES (inside each server). Vehicles stay deliberately unnamed \u2014 a Runner, or a salvaged in-game spaceship \u2014 because GENESIS is a world of ARCHIVED GAMES AND DATA, which is what reconciles everything: a spaceship, a dungeon or a racetrack can legitimately exist as old-game loot sitting on a Drive, so the network frame CONTAINS the space frame instead of competing with it. Renamed in player-facing text only (tab Planets -> Travel, planet -> Drive, galaxy -> server); code names, save keys and dev notes were left alone on purpose, since a blind find/replace would have broken the planet* identifiers.","PHASE 12 (GALAXY LAYER, slice 3d \u2014 PLANET LOOT DROPS, v0.13.11) \u2014 a producing generated planet now DRIPS LOOT as you tap it, flavoured by its own loot profile. New CONFIG.galaxies.loot (tapDropChanceByBand 0.4%\u21921.5%, boostShare 0.25) + pure rollPlanetLoot(planet, now, luck): a small per-tap chance, ceilinged by the planet's band, rarity nudged by the planet's loot.rarityTilt (positive \u2192 rarer, capped by band), theme carried onto the item; mostly character gear, sometimes a consumable boost, tagged provenance source:'planet'. Wired into the tap action: when landed on a producing planet (already the only place tap works away), each tap rolls loot (a crit gives luck \xD71.5), unshifts it into inventory (respecting the inventory limit), bumps statistics.planetLoot and toasts the find. Home tapping is completely untouched. This finishes the Phase-12 planet-content set: 3a perks live, 3b capsules, 3c surveys, 3d loot \u2014 so a producing planet now pays you four ways (perks while you stand, tap loot, a capsule cache, and Echo surveys). Tests: test12n (9) green \u2014 bare rock/null never drop, drop rate \u2248 configured per band, deep>start frequency, drops valid + band-capped + gear&boost + source:'planet'. All test12..12m still green; full-App mount clean; nested-component guard clean. No save-version change (rollPlanetLoot is derived; inventory already persists; v12). REMAINING for Phase 12: a full scripted ONBOARDING tutorial (the capital gate + signpost from 4c already exist) \u2014 the last piece before Phase 13 (Auction House / multiplayer).","PHASE 12 (GALAXY LAYER, slice 3b \u2014 CAPSULES ON PLANETS, v0.13.10) \u2014 a producing generated planet with hasCapsules now has a real capsule cache, and the 'capsuleCost' perk finally does something. computeStats gates capsuleAvailable on the planet when away (inHomeGalaxy ? here-is-a-server : the landed planet hasCapsules && !bareRock), and exposes s.awayCapsules. NOTE this also FIXES a latent quirk: because currentLocationId always resolves to a Home server, capsuleAvailable used to read true even in orbit / on a bare rock away \u2014 now it's correctly false unless the planet actually has a cache. New createPlanetEcho(g, planet): species are drawn from the pool of servers you've DISCOVERED (so distant capsules pull on your whole unlocked roster, not one place), and the planet's band biases rarity upward (shift 1 + rank*0.6 \u2014 far planets pay better Echoes); forced rarity respected. decrypt() branches: away on a hasCapsules planet \u2192 createPlanetEcho, else the normal server draw; it also now guards on s.capsuleAvailable ('No capsules here'). Cost is still Fragments, run through the full multiplier stack incl. pm.capsuleCost, so a 'Cheap Signals' planet genuinely costs fewer Fragments. UI: CapsulePanel shows an explicit 'No capsules here' state when unavailable, and reads the PLANET name in 'Found in \u2026' when away; the Hub shows a '\u25C7 Capsule cache' chip on capsule planets so it's discoverable. Tests: test12m (11) green \u2014 capsuleAvailable true at Home + on cache planets, false on bare-rock / no-cache / in-orbit; createPlanetEcho valid, species from discovered servers, valid + forced rarities. All test12..12l still green; CapsulePanel renders home/cache-planet/unavailable; full-App mount clean. No save change (v12). REMAINING Phase-12 planet content: 3d broader loot/drops from a planet's loot profile (survey already rolls loot); plus a full scripted onboarding (capital gate + signpost already exist).","PHASE 12 (GALAXY LAYER, slice 3c \u2014 PLANET SURVEYS, v0.13.9) \u2014 generated planets are now worth investigating, and the last two perks (expedition + echoXp) come to life. A PLANET SURVEY is a self-contained, timestamp-resolved (offline-safe) mission on a producing planet that has expeditions: send one of your Echoes, wait a band-scaled duration (CONFIG.galaxies.survey.durationByBand, 2\u201312 min), then CLAIM Data + Fragments + a chance at loot (rolled from the planet's band/theme), and the Echo gains XP. Everything scales by the planet's OWN perks: Data/Fragments \xD7 the 'expedition' perk, Echo XP \xD7 the 'echoXp' perk \u2014 so those two perk types, inert until now, finally pay off. One survey at a time (geo.planetSurvey {galaxy,planet,echoId,startAt,endAt}); the committed Echo is added to committedEchoSet so it can't be double-used; validate keeps a survey only while its planet still generates surveyable, else clears it (freeing the Echo). Refactored planetPerkMods \u2192 a reusable perkModsForPlanet(planet) so a survey reads its planet's perks from anywhere (planetPerkMods(g) now just wraps it). New pure fns: planetSurveyDuration, planetSurveyable, planetSurveyState (live clock like transitState), planetSurveyPlanet, planetSurveyReward (deterministic amounts + perk mults; loot rolled in the store). Actions: startPlanetSurvey(echoId) (gated: on a producing hasExpeditions planet, no survey running, Echo free), claimPlanetSurvey() (done\u2192grant+clear), cancelPlanetSurvey() (frees the Echo, no reward). UI: PlanetSurveyPanel on the Hub (module-scope, guard green) \u2014 idle (pick a free Echo, see the payoff, Start) when you're on a surveyable planet, and running/done (timer/progress, Call off, Claim) shown from ANYWHERE while a survey is out. Tests: test12l (17) green \u2014 duration by band, surveyable gate, reward scales by expedition/echoXp perks, state lifecycle (running/done), committedEchoSet integration, planetSurveyPlanet resolves, validate survives/clears. All test12..12k still green; survey panel renders idle/no-echoes/running/done/null; full-App mount clean (79624). No save-version change (planetSurvey is additive + validate-defaulted; v12). REMAINING Phase-12 planet content: 3b capsules on hasCapsules planets (capsuleCost perk already discounts), 3d broader loot/drops from a planet's loot profile (survey already rolls loot); plus 4c-full a scripted onboarding tutorial (the capital gate + signpost exist).","PHASE 12 (GALAXY LAYER, slice 4c \u2014 THE CAPITAL OPENS THE NETWORK, v0.13.8) \u2014 the onboarding gate from the owner's WoW-style vision: you can't scan The Network from where you START (Neon Hub). You must travel to the HOME CAPITAL (CONFIG.galaxies.capitalId = 'arcade87' \u2014 the first proper server past Neon Hub, ~2 free hops away), and reaching it opens The Network for good. New geo.networkUnlocked (bool, default false). buildArrivalState sets it true on arrival at the capital (so travel, RETURN LINK, event-route and debug-position all unlock identically). validate persists it AND unlocks if the capital is already in discoveredLocationIds (covers existing saves / anyone who's been there). scanNetwork() is gated: locked \u2192 toast 'Travel to Arcade-87 to open The Network' and no scan. GalaxyMapView shows a LOCKED panel until then ('The Network is closed \u2014 travel to <Capital> \u2026 then scan here'), swapping to the live Scan panel once open. SIGNPOST: while locked, the capital node on the Home map wears a gold dashed ring + '\u25C8 NETWORK' label so a new player is drawn toward it. Tests: test12k (9) green \u2014 fresh=closed and you don't start at the capital, arriving at the capital opens it, arriving elsewhere doesn't, stays open after leaving, validate unlocks on discovered-capital + persists + stays closed otherwise. All test12..12j still green; Network renders locked/open, Home map renders the signpost; mount clean. No save-version change (additive geo bool, validate-defaulted; v12). NOTE: this is the GATE + signpost, not a full scripted tutorial \u2014 a first-mission/onboarding script can layer on later. NEXT: generated-planet MISSIONS/expeditions (3c, so planets are worth investigating + unlocks the expedition/echoXp perks), capsules on hasCapsules planets (3b), loot (3d).","PHASE 12 (GALAXY LAYER, slice 4b \u2014 SCAN THE NETWORK, v0.13.7) \u2014 you no longer see the whole Network at once: generated servers are DISCOVERED BY SCANNING, one at a time. New geo.serversDiscovered {index:{at}} (Home always known, never stored). Pure helpers: isServerDiscovered, discoveredServerCount, nextUndiscoveredServerIndex (lowest revealed index not found \u2014 nearer/easier servers first), networkScanCost (Data, = scanBaseCost 5000 \xD7 scanCostGrowth 2.2^found, so mapping the Network is an escalating investment). Action scanNetwork() spends Data, reveals the next server, toasts its name/band; debugRevealServers + a debug scan button added (the debug warp buttons now need a discovered target). warpToGalaxy gated: you can't travel to an undiscovered server. The Network map (galaxyMapNodes) now shows Home + your DISCOVERED servers as real nodes + up to unknownShown (4) '???' placeholders at their real spiral spots, so the frontier visibly expands as you scan; tapping a '???' shows an 'Unknown signal \u2014 scan to bring it into focus' sheet (name stays hidden). GalaxyMapView gained a Scan panel (cost, affordability, 'X of 12 found', 'fully mapped'). validate SAFETY: standing in a server auto-marks it discovered (you can never be stuck in an unknown one); serversDiscovered survives validate, garbage resets to {}. Tests: test12j (15) green \u2014 Home always known, sequential discovery order, cost climbs = base\xD7growth^found, fully-mapped\u2192null, in-a-server auto-discovers, survives validate. All test12..12i still green; Network renders fresh/partial/fully-mapped; mount clean. No save-version change (additive geo field, validate-defaulted; v12). NEXT (4c): scanning gated to a hub/'main city' planet + onboarding (start Neon Hub \u2192 first mission \u2192 travel to capital where The Network opens). Then generated-planet MISSIONS/expeditions (3c), capsules (3b), loot (3d).","PHASE 12 (GALAXY LAYER, slice 4a \u2014 ONE NESTED MAP, v0.13.6) \u2014 owner flagged that the Planets tab still FELT like two map systems: the home planet map, plus a 'Galaxy map' BUTTON that jumped to a separate-feeling page. Reframed into one nested drill-in/out system. New module-scope NetworkBreadcrumb ('\u25C8 The Network \u203A [server]') sits above EVERY planet map (home and generated), identical on both; tapping 'The Network' zooms OUT to the server map, tapping a server there drills back IN to its planets. Replaced the home '\u{1F30C} Galaxy map' bar and the generated '\u{1F30C} Galaxies' button with this one breadcrumb, so the two levels read as one hierarchy (Network \u21C4 a server's planets) rather than parallel pages. GalaxyMapView reframed as 'The Network': home node = 'Home server' ('where you started \u2014 your factory, planets and expeditions live here'), generated nodes = servers; buttons say Travel (not Warp). Terminology aligned to the owner's model (top level = SERVERS you travel between; inside a server = PLANETS), matching the locked vocab (Server = galaxy holds planets). Pure UI over the tested spine \u2014 no logic change; all travel/land still via the store actions; all test12..12i green; mount clean (79053 chars); all nav views render. Save v12. This is the owner's WoW-style vision, step 1 (the nesting). NEXT slices toward the full vision: (4b) SCAN discovers new servers on The Network (generated servers hidden behind '???' until scanned, one at a time) + scanning available from a hub/'main city' planet; (4c) onboarding \u2014 start at Neon Hub, a first mission, travel to the capital where the network opens; then generated-planet MISSIONS (expeditions, ties to slice 3c) so planets are worth investigating.","PHASE 12 (GALAXY LAYER, slice 3a \u2014 PLANET PERKS GO LIVE, v0.13.5) \u2014 generated planets now MATTER: standing on a producing one applies its composed perks to your actual numbers. New pure planetPerkMods(g) builds a modifier set from the landed planet's perks \u2014 production/tap/fragments/expedition are bonuses (mult 1+strength), capsuleCost is a reduction (mult 1-strength), echoXp carried for later; all 1 (no effect) at Home, on a bare rock, or before you land. It slots into the SAME computeStats multiplier stack as Server/Event/Connection mods (the reason perks were designed to reuse those surfaces in slice 1): dps, per-building, tapPower, fragmentChance, idleFragmentChance, capsuleCost and expeditionBonus all take a pm.* factor, and computeStats exposes s.planetPerks. So on a 'Rich Seam +22%' planet your tapping/idle Data is +2
