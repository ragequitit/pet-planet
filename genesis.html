y sheet with band/planet-count/theme + Warp (Home free), a planet sheet with content/perks + Land. 'You are here' ring + selection ring on nodes. The old gx-cards list markup + CSS is gone. Pure UI over the tested 2a spine \u2014 no logic change; all warp/land still go through the store actions. Rendered all four states (both map views + ServersScreen home & inside-a-galaxy) clean; full-App mount clean (78275 chars); all test12..12h green; nested-component guard green (GalaxySpaceMap is module-scope). No save change (v12). NEXT unchanged: slice 3 \u2014 wire generated-planet perks into computeStats + give producing planets capsules/expeditions/loot.","PHASE 12 (GALAXY LAYER, slice 2b \u2014 THE GALAXY MAP UI, v0.13.2) \u2014 the navigation spine (2a) now has a real two-level map, replacing the debug buttons. In the Planets tab, a '\u{1F30C} Galaxy map' bar sits above the Home map; it opens GalaxyMapView \u2014 Home plus every revealed generated galaxy as a warpable card (name/band/planet-count/theme, warp cost in Credits, Home free, 'you are here' marked). Warping to a generated galaxy drops you into GeneratedGalaxyView: that galaxy's planets as cards (name/theme/content/perks, or 'bare rock'), each with a Land button, the landed one marked, plus a 'Warp home \xB7 Free' button and a '\u{1F30C} Galaxies' button to zoom back out. The Home galaxy still renders the existing NetworkMap untouched \u2014 the whole 2b change is three early branches in ServersScreen (galaxyMap state / away) plus two module-scope components (GalaxyMapView, GeneratedGalaxyView \u2014 nested-guard green) and helper fns galaxyThemeColor/planetContentLine. All warp/land go through the 2a store actions (still Credit-costed, Home-free, bounds-safe), so no new logic \u2014 this slice is pure UI over the tested spine. Debug warp buttons kept (harmless). Rendered all four states through a GameCtx provider (GalaxyMapView, GeneratedGalaxyView, ServersScreen home w/ galaxy bar, ServersScreen in a generated galaxy) \u2014 all clean; full-App mount clean (78542 chars); all test12..12h still green. No save-version change (v12). NEXT (slice 3): make generated planets actually PLAY \u2014 wire each planet's composed perks into computeStats (they already reuse existing modifier surfaces), and give producing planets their capsules/expeditions/loot per the generated flags. That turns the now-explorable galaxies into places worth staying.","PHASE 12 (GALAXY LAYER, slice 2a \u2014 NAVIGATION SPINE, v0.13.1) \u2014 you can now WARP between galaxies and LAND on generated planets. This is the invisible spine (state + pure helpers + gates + actions + a minimal Hub + debug buttons); the full galaxy MAP UI is slice 2b. THE INTEGRATION APPROACH (chosen to NOT break Home): g.geo.currentLocationId still always holds your HOME-galaxy position (so the ~30 callers of currentLocationId never break); a NEW g.geo.currentGalaxy (0=Home) + currentPlanet (index in a generated galaxy) sits ON TOP, and only the few surfaces that matter consult it. When away (currentGalaxy>0): the factory drops to the neutral baseline (servers.active=starter, in both warp and validate), CONNECTION is OFF (connectionElapsed/connectionModifierSet/syncConnection all short-circuit on !inHomeGalaxy), Home EXPEDITIONS aren't launchable (missionVisible false), and TAP works only on a landed producing planet \u2014 a bare rock or pre-landing has no Core. Home (0) keeps every existing system byte-for-byte. Pure helpers: currentGalaxyIndex, inHomeGalaxy, currentPlanetData (generate-on-demand, never stored), galaxyWarpCost (scales with the target band; Home cheapest). Actions: warpToGalaxy(idx) \u2014 Home is FREE (the stranding rule extends to galaxies: you can never be stuck out there), a generated galaxy costs Credits by band, leaving resets Connection, arriving Home restores your Home position via buildArrivalState; landOnPlanet(idx) \u2014 sets currentPlanet, records visited. State survives validate with hard BOUNDS: an out-of-range galaxy or planet snaps you Home/unlanded (never stranded in a galaxy that isn't there); Home always forces currentPlanet null; Home is always a visited galaxy. On Reboot you return Home (geo resets to default). Minimal Hub: away shows the generated planet name/theme (or 'bare rock' / 'land on a planet'), and tapping a producing away-planet works at baseline (perks arrive in slice 3). DEBUG buttons (warp\u21921, land on planet 0, warp home) exercise it in-app. Tests: test12h (20) green \u2014 warp cost order, helpers, validate bounds/never-stranded, Connection off away, expeditions gated, computeStats safe away, Home restoration. All test12..12g still green; full-App mount clean; Hub renders in all away states (producing/bare-rock/orbit). No save-version change (additive geo fields, validate-defaulted; save stays v12). NEXT (slice 2b): the two-level galaxy MAP UI (see/warp galaxies + a planet map within a galaxy) replacing the debug buttons. Then slice 3: generated-planet perks/capsules/expeditions/loot wired live.","PHASE 12 (GALAXY LAYER, slice 1 \u2014 THE GENERATOR + PREVIEW, v0.13.0) \u2014 the big one begins: a SERVER is a GALAXY of procedurally-generated PLANETS. This slice is the generator + a dev preview ONLY \u2014 nothing is wired into the live map yet (zero risk to the working game), so the owner can SEE and TUNE generated galaxies/planets/names/perks before we rebuild navigation. THE ARCHITECTURE (the load-bearing decision): the whole universe is a PURE FUNCTION of a fixed CONFIG.galaxies.masterSeed + indices \u2014 nothing is stored, so the save never grows with how far you explore (the size rule holds), and a real server can regenerate the identical galaxy later (multiplayer-ready \u2014 everyone shares the same procedural universe). Deterministic: generateGalaxy(n) always returns the same galaxy (test-proven, byte-identical on repeat). Built INFINITE-CAPABLE (any index works \u2014 proven across 300 galaxies, no crash) but CONFIG.galaxies.revealedCount (12) bounds what we surface now, so it feels vast without overwhelming \u2014 the owner's 'a gang of galaxies now, neverending later' call. Galaxy 0 = the hand-authored HOME galaxy (the current 16-place map, all existing Echoes/capsules/expeditions/lore untouched); galaxies 1+ are generated. generateGalaxy \u2192 { name, band, theme, planetCount (4\u201316), planets[] }; generatePlanet \u2192 { name, theme, band, bareRock, perks[], hasCapsules/Echoes/Expeditions, loot, x/y }. PERKS ARE COMPOSED, not authored (the owner's method): a 6-type set (production/tap/fragments/capsuleCost/expedition/echoXp) reusing existing modifier surfaces (so wiring into computeStats in slice 3 is trivial), varied per planet in which/how-many (perkCountWeights)/how-strong (perkStrengthByBand \u2014 near ~20% \u2026 far ~50%). Some planets are a BARE ROCK: no perks, no content, just a place. Distance band grows with galaxy index (bandByIndex), so far galaxies have stronger perks + better loot. Names are coined deterministically from a syllable pool + suffixes (measured samples: 'Thernyxzon Expanse', 'Vorrinqel-7', 'Solmirax Sprawl', 'Drohel Deep' \u2014 good alien vibe; 200+ distinct planet names across the revealed set; tune the pools freely, no code change). Reused the existing seededRng (xorshift) + rng-aware weightedPick/randInt/pickOne \u2014 no new PRNG. DEV PREVIEW: Debug panel \u2192 'Preview generated galaxies' opens GalaxyPreviewModal (module-scope, guard green), an accordion of the revealed galaxies \u2192 their planets with theme/content/perks. Tests: test12g (317 assertions) green \u2014 determinism, infinite-capable no-crash, valid bands, non-empty names, bare rocks present, perk-count variety, band grows outward, revealed set excludes home, perks reference real types with positive strength, seeds stable+independent. All test12/12b/12c/12d/12e/12f still green; preview modal + full-App mount clean. No new persistent state, save stays v12. NEXT (slice 2): the two-level navigation \u2014 a galaxy map + warping between galaxies (within a galaxy the current planet map works); then slice 3: generated planets fully playable (perks/loot wired into the live systems).","PHASE 12.x (step 4b \u2014 ACTIVE SCOOP, the tap layer) \u2014 the transit view is now playable: while in flight with the app open, DRIFTERS float across the ship stage and you TAP them to scoop a bonus on top of the guaranteed passive haul. Three kinds (data mote / fragment cluster / rarer cache), weighted, spawned on the panel's own interval (self-cleaning \u2014 the panel only exists while in flight). scoopDrifter(kind) grants the reward via pure transitScoopGrant against a per-journey CAP (transitScoopCap): active Data cap = the passive Data floor (so engaging fully ~doubles transit Data), fragment cap grows with journey length. LOCKED RULE honoured: NEVER Credits (proven). NEVER FARMABLE: the cap is per journey and you cannot extend a journey (warp only shortens it); the scooped counter lives ON the transit object and SURVIVES validate/reopen, so you cannot close-and-reopen to re-farm a journey's cap. App-open-only, so it is pure bonus \u2014 the passive floor (step 4a) covers anyone who closes the app, so not engaging is never a loss. UI: DrifterField is module-scope (nested-component guard stays green), DOM not canvas (mount-safe \u2014 renders 1351 chars mid-flight through a GameCtx provider), with a tap 'pop' and a live 'scooped so far / hold full' readout; the panel hides the field and shows 'hold full' once capped. Tuning in CONFIG.travel.transit.scoop (spawnEveryMs 1400, maxOnScreen 3, lifetimeMs 3800, dataScoopShare 0.03, kindWeights data6/frag3/cache1). Tests: test12f (15) green \u2014 no-Credits, caps EXACTLY (never over), cap scales with time+band, scooped survives validate. All of test12/12b/12c/12d/12e still green; full-App mount clean (77054 chars). **THE TAP FEEL (spawn cadence, hit area, whether tapping mid-flight is satisfying) IS ONLY VERIFIABLE ON THE REAL DEVICE \u2014 needs owner playtest.** No save change (scooped rides on the existing transit object; save stays v12). This closes the transit arc the owner opened. Still open: 3c (levelling parts, Rule 7) \u2014 owner chose to wait entirely.","PHASE 12.x (step 4 \u2014 SALVAGE IN TRANSIT, the passive layer) \u2014 the loop closes back to the owner's original idea: you now FIND things flying through the stream between planets. On arrival, arriveIfDue scoops a haul via the pure transitHaul(): Data (deterministic, dataPerMinuteByBand x minutes), Fragments (a per-minute chance, band-scaled lump), and the occasional drifting vehicle PART (wreckage) \u2014 band-bounded by where you ARRIVE (deep planets \u2192 better parts; start never exceeds its band), some arriving broken (partBrokenChance 0.35, repaired via step 3). LOCKED RULE HONOURED: the haul is NEVER Credits (proven across 500 rolls) \u2014 a slow trip must never out-earn warp. Scaled by ACTUAL transit time, so WARP (quarter the time) scoops a quarter of the haul \u2014 the scenic route's spoils are exactly what you trade for speed (measured: warp haul / standard haul = 0.25). Timestamp-resolved at arrival, so it lands even if the app was closed the whole trip; an instant/free trip (duration 0) salvages nothing. The CARGO HOLD utility slot finally has its job: cargoTransitBonus multiplies the whole haul (mythic +50%, scaled by rarityFraction; 0 if broken; never affects speed). The arrival toast lists what you salvaged; a found part goes to the Ship inventory, Data/Fragments to the HUD. Measured on the current map: Void Terminal (17.6 min, deep) \u2248 +3.5M Data, ~15 Fragments, 15% chance of a part; Glass Ocean (4 min, start) \u2248 +1.6K Data, ~2 Fragments \u2014 modest vs idle/expeditions, so it complements rather than replaces them. No new persistent state (the haul is granted immediately; save stays v12). Tests: test12e (~445 assertions incl. per-part checks) green \u2014 no-Credits invariant, deterministic Data, warp=\xBC, band-bounded parts, cargo bonus; all of test12/12b/12c/12d still green; full-App mount clean. DEFERRED to step 4b: the ACTIVE scoop layer \u2014 drifters floating in the transit view you TAP for a bonus (canvas; only while the app is open, so it layers on top of this guaranteed passive floor). Also still open: 3c (levelling parts, the Rule 7 question) \u2014 owner chose to wait; rarities alone are enough progression for now.","PHASE 12.x (vehicle loadout, step 3 \u2014 PARTS DROP + REPAIR) \u2014 the ship loadout now fills through play. rollItemDrop can yield a VEHICLE PART instead of gear/boost: after the boost roll, partShareOfDrops (0.25 of the non-boost drops) makes a part; type is weighted (thruster 3 / engineCore 2 / warpDrive 2 / cargoHold 1 \u2014 thrusters are two slots), rarity shares the band roll (so a deep planet's parts are better, a start planet's never exceed its band \u2014 both tested over thousands of rolls), and the part carries the planet's theme. brokenChanceOnDrop (0.35) means some found parts arrive DAMAGED: they fit nothing and give no speed until repaired. REPAIR: repairPart(itemId) spends Credits = repairCost = repairFraction (0.35) x the part's Credit value. That fraction is deliberately ABOVE economy.sellFraction (0.15), which makes 'find/buy broken cheap -> repair -> sell to the system' impossible to profit from \u2014 proven for common/rare/legendary (repair >= sell always; a common floors to break-even, never a gain). Repair is for USING a part (or, in Phase 13, listing it on the player AH where it can fetch more). A Credit SINK, which the economy wants. UI: broken parts show a dashed red row / a '\u2715' in their slot, and a 'repair \u25C7X' action in the Ship inventory and in a slot's fit-list (tapping a broken part repairs it instead of trying to fit it; equipVehiclePart already refuses a broken one). The Expedition result and minigame result cards now label a part 'SHIP PART FOUND' / 'SHIP PART (DAMAGED)'. Support: ItemArt already resolves part icons (step 2). No new state; save stays v12. Tests: test12d (19) green \u2014 repair-never-profitable invariant, parts drop within the band, broken parts inert until fixed; test12/12b/12c still green; vehicle sheet renders with a broken part; full-App mount clean. NEXT (3c): scrap/level parts \u2014 but that touches Rule 7 ('Scrap = one job, Echo levels'); bring the owner the options before building. Then step 4: finding parts in transit.","PHASE 12.x (vehicle loadout, step 2 \u2014 THE VEHICLE SHEET) \u2014 you can now SEE and gear up your ship. ProfileModal gained a third tab beside Character/Stats: VEHICLE, rendering VehicleSheet \u2014 the hull in the middle, its parts around it (engine core + warp drive on the left, two thrusters on the right, cargo hold under the hull), and the whole rig's travel discount up top with the \u221240% cap shown. Tapping a slot opens VehicleSlotDetail (worn part, its speed contribution or 'utility'/'damaged', fit/take-off), and a 'Ship inventory' list below shows every hull + part with its discount, equip, and sell. Three new MODULE-SCOPE components (VehicleSlotCell, VehicleSlotDetail, VehicleSheet \u2014 never nested, per the double-tap remount bug; the guard stays green). Vehicle hulls AND parts were MOVED out of the character sheet: the hull slot left the character figure, and the character inventory now skips kind 'vehiclePart' and slot 'vehicle' \u2014 ships live in the ship tab, body gear in the character tab. Support fixes so parts render right: ItemArt now resolves a part's icon from vehicles.partSlots (was falling back to a 'chest' glyph), and GearSlotGlyph gained core/warp/thruster/cargo glyphs (empty part slots now look distinct instead of a generic square). A broken part shows '\u2715' in its slot and contributes no speed (verified: an epic hull + rare warp + uncommon thruster = 12.4%, a broken legendary engine adds 0). Rendered through a GameCtx provider with a loaded-out ship (VehicleSheet + both a fitted and an empty VehicleSlotDetail) \u2014 all clean. Full-App mount clean; test12/12b/12c still green. No new state, no save change. NEXT: parts as drops (expeditions, band-bounded) + found-broken/repair-for-Credits + scrap/level, then finding parts in transit.","PHASE 12.x (vehicle loadout, step 1 \u2014 FOUNDATION) \u2014 VEHICLES BECOME A SECOND CHARACTER SHEET. Owner's design: you gear up your SHIP the way you gear up your character. A vehicle is now a HULL plus PARTS bolted around it \u2014 engine core, warp drive, two thrusters, and a utility cargo hold \u2014 each found (transit/expeditions), bought, or traded, in different rarities. This step is the SHAPE + the MATH only; nothing is dropped or shown yet (like Phase 11 step 1). THE REBALANCE (owner asked for the calculations, and set the ceiling at \u221240%): speed no longer comes from one item. Each speed source's discount = speedMaxBySlot x rarityFraction, and vehicleSystemDiscount SUMS hull+parts under maxSystemDiscount 0.40. Mythic-max per source: hull \u221212, warp \u221210, engine \u22128, thruster \u22125 each (sum = the \u221240 cap). rarityFraction: common .15 / uncommon .25 / rare .40 / epic .60 / legendary .80 / mythic 1.0 \u2014 chosen so a FULL loadout of rarity R \u2248 exactly what a single vehicle of rarity R gave before (common \u2248\u22126%, mythic =\u221240%). So the ceiling is unchanged but the road there is far deeper. A bare common hull is now \u22121.8% (down from \u22126%) \u2014 the intended downgrade; existing equipped vehicles auto-drop to hull-only (derived, no save migration). cargoHold gives NO speed (utility, kept off the budget for build variety). New pure fns: vehicleTravelDiscount (now hull-only, derived), partSpeedDiscount (per-part, 0 for cargo or a BROKEN part), vehicleSystemDiscount (clamped sum), makeVehiclePart, isVehiclePartSlot. State: items.vehicleParts { engineCore, warpDrive, thruster1, thruster2, cargoHold }, survives Reboot, validated against ghosts AND wrong-type pointers (a thruster mount only holds a 'thruster' part). Store: equipVehiclePart (a thruster auto-picks a free mount, like a ring picks a free finger; refuses a broken part), unequipVehiclePart, debugGrantVehiclePart. `broken` field is the hook for the next step (found broken -> repair for Credits). vehicleSystemDiscount flows through travelDiscountSet as one scope:all discount, so all existing travel/pathfinding/return-link pricing is untouched. EXPLOITS considered: (1) speed runaway \u2014 capped at \u221240% + global maxDiscount 0.85; a mythic rig is a long grind, not one lucky drop. (2) 'travel -> better ship -> cheaper travel' snowball is bounded by the same cap + one hull equipped + band-bounded part rarity. (3) OPEN for the leveling step: letting Scrap level vehicle parts brushes Rule 7 ('Scrap = one job'); decide when we build it. Save stays v12 (items.vehicleParts is additive, validate-defaulted). Tests: test12c (27 assertions) green \u2014 budget sums to cap, full-loadout\u2248old-single-vehicle equivalence, hull downgrade, clamp, validate, Reboot; test12/test12b still green; full-App mount clean. NEXT: the vehicle character-sheet UI (gear up the ship), then parts as drops + repair, then finding parts in transit.","PHASE 12 (step 1) \u2014 TRAVEL TAKES TIME + ETA + WARP. Travel is no longer instant: departing sets geo.transit and you ARRIVE later, resolved purely from timestamps (Rule 5) so a journey completes even if the app was closed for its whole duration. ETA = total path distance x 48s (0.8 min/distance) \u2014 anchored so the deepest current haul, Void Terminal (path distance 22), lands at ~17.6 min, matching the roadmap's 'ETA 18 min'. A FULLY-free trip (cost 0 \u2014 the Hub/Junction/Arcade spine and event routes) stays INSTANT, so the load-bearing free routes never become a wait and event-travel objectives never turn into a toll of time. WARP is an optional Credit surcharge at departure (warp.fareMult x2 the fare to arrive in warp.speedFactor=0.25 of the time) \u2014 NO new resource, so Rule 7 holds (owner chose the surcharge over a stored fuel item). Pure fns: pathTotalDistance, transitDurationMs, transitFare, transitState (reads the clock LIVE \u2014 the \xA77 frozen-countdown lesson), inTransit. travelTo split into DEPART (pay once, record history/stats, reset Connection the moment you leave per Rule 11, drop the factory to neutral baseline, set transit) and _applyArrival (buildArrivalState as the single arrival truth + reveal/servers/region/stats), landed by arriveIfDue() in the 10Hz loop exactly like an expedition completing. arriveAt is passed as the landing moment so Connection accrues from touchdown, not from when the loop noticed. GATES while in flight: tap (no Core in space), missionVisible (launch nothing mid-flight \u2014 running expeditions still resolve, they key off the instance), the Arcade, useReturnLink (arrive first, then the stranding guarantee is exactly as before), and travelTo itself (one journey at a time). EXPLOITS considered and closed: (a) transit will only ever yield Data/Fragments when 'things to do in transit' is built later, never Credits \u2014 a slow trip must never out-earn warp; locked as a rule now. (b) You can never be stuck in transit: fare is paid up front, arrival is timestamp-only, so a broke player who departs always lands (test12b proves it). (c) Clock-fast-forward is the same trust model as offline/expeditions, not worse. (d) RETURN LINK stays instant (emergency beacon, home only) \u2014 not a fast-travel exploit because it only reaches Neon Hub and still costs its Credits. UI: TransitFlightPanel replaces the Core on the Hub with a LIVE ETA countdown; TravelModal gained a Warp toggle + an ETA/travel-time line and now gates on CREDITS (fixing a pre-existing mislabel that showed 'You have {Data}' though travel costs Credits); an in-transit banner tops the Expeditions tab. Save stays v12 (geo.transit is an additive nullable field validate defaults to null). Tests: test12 (31 pure) + test12b (15 integration incl. stranding) green; full-App mount clean. DEFERRED to Phase 12 step 2: things to do in transit (scoop drifting data-capsules / collect en-route Data-Fragments) \u2014 the framework hook is the transit state; only Data/Fragments, never Credits.","PHASE 1 \u2014 Data Core tapping, idle production, 6 buildings, 6 upgrades","PHASE 1 \u2014 Capsule decryption, 8 starter Echoes, 5 rarities, ability rolls","PHASE 1 \u2014 Active slots, inventory, Index, objectives, achievements, rank","PHASE 1 \u2014 Offline progress, versioned save, settings, debug panel","PHASE 2 \u2014 Network Scan with doubling cost and duplicate-signal refunds","PHASE 2 \u2014 8 Servers with lore, status, theme, background and special rules","PHASE 2 \u2014 Travel (free+instant then; Phase 9 priced it, Phase 12 timed it); active Server feeds computeStats()","PHASE 2 \u2014 28 new Echo species across 7 Server pools (36 total)","PHASE 2 \u2014 Per-Server Capsules with rarity weight overrides","PHASE 2 \u2014 Mythic / Artifact / Celestial / Eternal / Origin reachable at Void Terminal","PHASE 2 \u2014 Server Index (status counts, tier counts, discovery dates, favorite)","PHASE 2 \u2014 6 new objectives, 8 new achievements, save migration v1 -> v2","PHASE 3 \u2014 Expedition slots (1-5), Data-purchased with rank + discovery gates","PHASE 3 \u2014 12 timed missions across all 8 Servers, real elapsed-time completion","PHASE 3 \u2014 Echo commitment: committed Echoes leave active slots and stop paying bonuses","PHASE 3 \u2014 Transparent success model (count, rarity, abilities, risk, local bonus)","PHASE 3 \u2014 Expedition Gain and Server mods.expedition are now live","PHASE 3 \u2014 Signal Cores: an Expedition-exclusive resource gating higher tiers","PHASE 3 \u2014 Success / Partial / Failure outcomes, no permanent Echo loss","PHASE 3 \u2014 Special results: Extra Life, Perfect Compile, Unknown Signal, Lost Access Key, Network Cartographer","PHASE 3 \u2014 Expedition Index, 8 objectives, 11 achievements, tutorial","PHASE 3 \u2014 Save migration v2 -> v3, full Expedition debug suite","PHASE 4 \u2014 Echo XP and levels are live; level and xp fields activated","PHASE 4 \u2014 Expeditions are the only XP source; every committed Echo earns the full amount","PHASE 4 \u2014 Rarity-gated level caps (Common 10 through Origin 60)","PHASE 4 \u2014 Level modifier: +1% ability effectiveness per level, multiplicative","PHASE 4 \u2014 Fusion: destroy duplicates of the same species and rarity for target XP","PHASE 4 \u2014 Locked and committed Echoes can never be consumed; Favorite and Active require a warning","PHASE 4 \u2014 Auto select, Fuse 5 / 10 / All Eligible, all behind an explicit confirmation","PHASE 4 \u2014 Fusion history (last 20), progression Index, 7 objectives, 8 achievements","PHASE 4 \u2014 Save migration v3 -> v4, full progression debug suite","PHASE 5 \u2014 Reboot: intentional run reset for permanent Network Shards","PHASE 5 \u2014 Shard formula sqrt(run Data / 1B), gated at 1B so a reset is always earned","PHASE 5 \u2014 Permanent Shard Tree: 6 multiplier branches + PROTOCOL branch that alters the run itself","PHASE 5 \u2014 Recursive Compilation: an uncapped node so infinite Shards always have a sink","PHASE 5 \u2014 Legacy Archive: every Echo is recorded per species before it is lost","PHASE 5 \u2014 Reboot history, lifetime statistics, double confirmation with a 3s arming delay","PHASE 5 \u2014 5 objectives, 5 achievements, save migration v4 -> v5, full Reboot debug suite","PHASE 5 (follow-up) \u2014 Echo level now also raises Expedition success by +0.15 points per level","PHASE 6 \u2014 Ability Extraction: destroy an Echo to preserve one of its abilities forever","PHASE 6 \u2014 Ability Imprints store type, tier and origin. Nothing else transfers.","PHASE 6 \u2014 Ability Vault is permanent and survives every Reboot","PHASE 6 \u2014 Vault capacity 10 -> 250, upgraded with Network Shards (a second permanent sink)","PHASE 6 \u2014 Install replaces an existing slot. Rarity ability COUNT is never increased.","PHASE 6 \u2014 Install costs Data + Signal Cores by tier, giving Cores a late-game purpose","PHASE 6 \u2014 Duplicate abilities can never be manufactured; natural rolls stay exclusive to RNG","PHASE 6 \u2014 Forge tab: Fusion, Extract, Vault, Install, Log. Extraction/install history (50 each).","PHASE 6 \u2014 5 objectives, 6 achievements, save migration v5 -> v6, full Vault debug suite","PHASE 7 \u2014 Ability Mutation on stored Imprints only. Never acts on an Echo directly.","PHASE 7 \u2014 Tier Refinement: Prisms only. May upgrade, stall or downgrade one tier.","PHASE 7 \u2014 Type Recompilation: Prisms + Signal Cores. Targeted, Cross-Compile or unchanged. Tier never moves.","PHASE 7 \u2014 Four brakes: 8-attempt hard limit, 1.65^n cost escalation, falling odds, real downgrade risk","PHASE 7 \u2014 Mutation Count is permanent, survives Reboot and never resets in normal play","PHASE 7 \u2014 Every probability is shown before confirmation. No hidden odds, no pity, no undo.","PHASE 7 \u2014 Locked Imprints are a hard block. Favorited require an armed warning.","PHASE 7 \u2014 Mutation Workbench inside Forge \u2192 Vault. Mutation log inside Forge \u2192 Log.","PHASE 7 \u2014 8 objectives, 11 achievements, tutorial, save migration v6 -> v7, full mutation debug suite","SOUND \u2014 full WebAudio synthesis engine. No files. Generative lo-fi music loop.","PHASE 9 \u2014 THE NETWORK is a node-and-route map: 4 Regions, 16 places, 24 routes","PHASE 9 \u2014 8 FULL SERVERS + 4 WAYPOINTS + 2 RELAYS + 2 ANOMALIES. Only Servers carry Capsules and Echoes.","PHASE 9 \u2014 Travel follows discovered routes and costs DATA by distance and route class","PHASE 9 \u2014 Neon Hub / Packet Junction / Arcade-87 stay free forever, so nothing early is gated behind a toll","PHASE 9 \u2014 Deterministic cheapest-path travel, multi-hop, resolved as one instant action","PHASE 9 \u2014 CONNECTION: staying on a Server pays more the longer you stay, and is given up when you leave","PHASE 9 \u2014 RETURN LINK: you can never be stranded. Broke means free.","PHASE 9 \u2014 One free journey to a featured Server per event instance. An event never becomes a toll.","PHASE 9 \u2014 Expeditions snapshot Connection at launch; travelling afterwards changes nothing","PHASE 9 \u2014 Cached Routes now hands out connected geography; Signal Clarity now also cuts travel cost","PHASE 9 \u2014 Reboot resets run geography, keeps lifetime travel records. Save migration v8 -> v9.","PHASE 10 \u2014 RECYCLE replaces FUSION. Any Echo, any species, any rarity, into SCRAP. Fusion wanted 76 identical copies (~5,067 Capsules) to max one Rare; it was decorative.","PHASE 10 \u2014 SCRAP: a sixth currency with exactly one job \u2014 Echo levels. 1 Scrap = 1 XP, no exchange rate. Bulk recycle: one confirmation, whatever the size.","PHASE 10 \u2014 REBOOT NO LONGER EATS THE COLLECTION. Echoes, their levels, the Index and Scrap are permanent. The factory resets; the family does not.","PHASE 10 \u2014 XP curve softened from x1.25 to x1.12 per level. Origin went from 472,936,534 XP (over a millennium of Expeditions) to 3.6M. The caps are untouched.","PHASE 10 \u2014 FIXED: the Connection countdown was frozen and, worse, the bonus did not start when the level turned over \u2014 the 10Hz loop calls render() but never recompute(). The panel now reads the clock; syncConnection recomputes on the level flip.","PHASE 10 \u2014 Explorer Rank now pays. It gated missions and slots up to rank 28 and then rewarded NOTHING; you could climb to 50 for a bigger number and nothing else. Every rank now gives Scrap, round ranks give Cores/Prisms, rank 25/50/... give a haul, and each band's first arrival pays once per account (tracked in meta so Reboot cannot re-farm it). Deliberately small \u2014 Phase 11 gives high ranks their real job: carrying better Items.","PHASE 10 \u2014 AUDIO (real cause): iOS unlocks an AudioContext only if resume() AND a real sample play SYNCHRONOUSLY inside the gesture. Every prior attempt did the work in a .then(), which runs after the gesture ends, so iOS never unlocked. The unlock handler now resumes and plays one silent sample inline, before it returns.","PHASE 10 \u2014 FIXED: my own audio fix crashed the boot \u2014 I read stateRef inside Shell, but stateRef lives in GameProvider; Shell only has `g` from useGame(). Compiled fine, threw at render. Now covered by a full-App mount test.","PHASE 10 \u2014 FIXED: sound and music did not start on launch \u2014 you had to toggle them in Settings first. The audio-unlock listener armed at mount, BEFORE the save loaded, so it read Sound's hardcoded defaults instead of the saved settings and the toggle was the first call that applied them. It now arms after boot, applies settings first, and retries every gesture until audio truly runs.","PHASE 10 \u2014 Found the real cause of the map zooming after tapping a node: the node's onPointerUp called stopPropagation, which skipped the svg's onUp, so its pointer was never removed and lingered \u2014 the next one-finger drag counted as two and zoomed. Node taps now delete their own pointer, and onDown self-heals any stale pointer when no gesture is active.","PHASE 10 \u2014 Map gestures rewritten: a one-finger drag zoomed instead of panning, because the gesture was chosen from a stored pointer count that went stale when a pointerup was missed (the touchmove guard interfered). It now decides zoom-vs-pan from how many fingers are ACTUALLY down each move, releases pointer capture on up, and hands two-to-one-finger transitions to pan cleanly. Touch guard moved from the svg to the wrapper so the whole surface blocks the host close-gesture.","PHASE 11.x \u2014 THE DOUBLE-TAP BUG, ACTUAL ROOT CAUSE: a nested component. It was isolated to the character sheet + shop (the two newest screens), which ruled out the shared modal mechanics. Cause: SlotCell was defined INSIDE CharacterSheet (const SlotCell = ...). A component declared inside another is a brand-new function identity every render, so when tapping a slot set state, CharacterSheet re-rendered, React saw a 'new' component type and unmounted/remounted the whole slot subtree \u2014 and on touch that discards the in-flight first tap, so it took two. Fix: SlotCell is now a stable module-level component taking props (equipped/inv/picked/setPicked). Added a testart regression guard that fails if any capitalised component is defined nested inside another (the pattern that causes this). The earlier backdrop-filter and stopPropagation fixes were real improvements but not this bug. NOTE: prior double-tap dev-notes below describe those two other fixes.","PHASE 11.x \u2014 THE DOUBLE-TAP BUG, REAL CAUSE: stopPropagation on modal boxes. The backdrop-filter removal helped elsewhere but popups/character-sheet STILL needed a double-tap. Real cause: every modal wrapped its content box in onClick={e=>e.stopPropagation()} (to stop scrim-close from firing on inner taps). On iOS that handler intercepted the FIRST tap of any button inside \u2014 the bubbling tap hit the stopPropagation handler, not the button, so it took a second tap. Fixed all six modals (the shared Modal + five inline ones): the scrim now closes only when the scrim ITSELF is tapped (e.target===e.currentTarget), and the inner box has NO onClick at all, so a button's first tap reaches it directly. This is the actual fix for the double-tap complaints.","PHASE 11.x \u2014 THE DOUBLE-TAP BUG: backdrop-filter. Everything inside popups (and much of the app) needed a double-tap to register \u2014 the classic iOS/WebKit bug where an interactive element sitting on top of a backdrop-filter blur layer swallows the first tap to compose the filter. It wasn't the buttons; it was the blurred layers above them. Removed backdrop-filter from every interactive layer \u2014 modal-scrim, panel (which wraps the whole character sheet + gear slots), hud, nav, rc-bar \u2014 each replaced with a slightly more opaque background so the look barely changes. The only remaining blur is on the toast, which is pointer-events:none and can never eat a tap. This is the real fix behind the earlier slot/close-button tap complaints.","PHASE 11.x \u2014 SHOP/TAP FIXES. Three reported bugs fixed. (1) The last shop rows 'spun like a slot machine': shopShelfItem used composeItemName (random prefix) and ShopModal rebuilt the shelf every render, re-rolling names/art each frame. Fixed: shelf gear now uses a STABLE name (rarity + fixed slot noun), and the shelf is built once via useMemo. (2) Modal close buttons (both .x and .mapsheet-x) were small/hard to hit \u2014 enlarged to 44x44 with touch-action:manipulation, a negative margin so they don't grow the header, and an :active state. (3) Gear slots still hard to tap \u2014 enlarged to 58px, added a 7px invisible ::after tap-target halo beyond each slot, and widened the column gap to 16px so the halos don't overlap neighbours. The vehicle slot now points to the Shop instead of an inline buy.","PHASE 11.x \u2014 SHOP + SELLING + iOS TAP FIX. THE SHOP: buy owner-curated gear, boosts and vehicles for Credits at 2x their value (convenient but dear). ShopModal opens from a \u25C7 Shop button by the inventory; shopShelf is the owner-curated shelf. SELLING: every inventory item has a small sell button (system buyback = 15% of value \u2014 a pittance on purpose, so the Auction House in Phase 13 pays more); can't sell an equipped item. itemBuyPrice/itemSellValue/shopShelfItem are pure; boosts get a rarity-based value since they have no ilvl. Buying-then-selling is a heavy loss (2x vs 15%) so it is never a money loop. Vehicles keep their intended Credit price (x markup) rather than deriving from low combat power. iOS FIX: gear slots were hard to tap and double-tap zoomed \u2014 added touch-action:manipulation + user-select:none on the slot and pointer-events:none on inner art so the whole slot is one clean tap target (the inner image was stealing taps, hence the double-tap). The vehicle slot now points to the Shop instead of an inline buy.","PHASE 11.x \u2014 VEHICLES. The vehicle gear slot now matters: a vehicle is normal gear (Combat Power, drops from Expeditions) but ALSO carries a TRAVEL DISCOUNT while equipped, scaling by rarity (common \u22126% \u2026 mythic \u221240%), capped under travel.maxDiscount so it never trivialises travel. vehicleTravelDiscount reads it; travelDiscountSet adds an equipped vehicle as a scope:all discount, so it flows through the whole existing travel/pathfinding/return-link pricing untouched. Two basic vehicles are BUYABLE for Credits (Signal Scooter 40cr/\u22126%, Courier Rig 140cr/\u221210%) so a first ride isn''t luck-gated; buyVehicle spends Credits and drops the item in inventory. SlotDetail (vehicle slot) shows the discount, lists rides with their travel %, and offers the buyable basics. Measured: a 9-Credit hop drops to 7 with an epic vehicle.","PHASE 11.x \u2014 THREE HACKER MINIGAMES + COOLDOWN RAISED TO 20 MIN. Library now has SIX games. Added three hacker-themed ones: Signal Lock (tune two sliders to match a hidden carrier wave, hold the lock, beat a trace bar), Cipher Echo (Simon-style \u2014 watch a flashing access code, tap it back, it grows each round), and Net Crack (route a path from entry to core through a node grid before the lockout timer empties). MinigameHost routes six kinds; minigameForPlanet spreads six games evenly across eight planets (max two each). CRITICAL BALANCE FIX: the win cooldown was 5 min \u2014 far too short (owner spotted you could clear a start planet ~10x in 5 min for ~50 Credits). Raised to 20 min PER PLANET; a FAILED run sets no cooldown (retry at once, you earned nothing). Measured: even perfect farming of all planets stays under ~750 cr/h, versus a ~1,785 cr deep fare \u2014 a complement to income, never an exploit.","PHASE 11.x \u2014 TWO MORE MINIGAMES + MOVED TO EXPEDITIONS. The library grew from one game to three: Debris Run (shooter), Data Snake (a Snake-like \u2014 grow a grid worm eating packets, die on wall/tail, swipe or d-pad to steer), and Core Breach (a tap-brawler \u2014 tap swarming intruders before they reach the core, then bring down a guardian boss). MinigameHost routes a game's `kind` to its canvas component, so adding a game is: add to library + write the component + one route line (reward/cooldown/scaling already shared). minigameForPlanet deals games round-robin across the sorted planets \u2014 stable per planet, evenly spread (3/2/3 across 8 planets). The arcade entry MOVED from the Hub to the Expeditions tab (owner: it belongs where you choose what to do on a planet \u2014 send Echoes idly, or play actively). Canvas gameplay only verifiable in the real app.","PHASE 11.x \u2014 ALL 8 GEAR THEMES DRAWN. The three sample themes became all eight, one per planet, so every planet's loot now has its own composed SVG look through ItemArt (until the owner drops his own raster art over it). Added: glass (faceted/translucent with a glare line), arcade (chunky retro cabinet with scanlines), signal (broadcast waves + antenna), vault (bolted armour plates + central lock), neon (glowing double-stroke tube outlines). Each is a draw(icon,color) fn with per-slot bodies, same pattern as forge/pixel/void. Measured: all 88 theme\xD7slot combos render with no crash. The owner's raster art still wins when present; these are the fallback look.","PHASE 11.x \u2014 MINIGAMES (framework + first game). The ACTIVE counterpart to Expeditions: instead of waiting, you PLAY. Built the framework and ONE game (Debris Run, an Asteroids-like remade as our own \u2014 canvas + rAF, drag to steer, auto-fire, clear the band's target score before three hits). Difficulty and reward scale with the planet's distance band (same bands as loot): start pays ~5 Credits at a 500 target, far pays ~191 at 8000. Clearing rolls loot through the SAME rollItemDrop as Expeditions (band-bounded), and a 5-min per-planet cooldown stops farming. Reached via an Arcade panel on the Hub (producing planets only). One game proves the framework; more arcade archetypes (Snake/Tetris/Joust-likes, combat/boss games) slot in beside it later \u2014 all remade as our own, never the trademarked originals. Canvas play is unverifiable in Node; reward logic + mount are test-covered.","PHASE 11.x \u2014 ITEM ART (hook + 3 sample themes). Every item now renders through ItemArt, which picks its picture in priority: (1) the owner's raster image (item.art \u2014 from his own generator/ChatGPT) wins when present; (2) a theme-composed SVG glyph (ThemedGearGlyph) for themes I've drawn; (3) the plain line icon as universal fallback. So the owner can drop generated images in over time and nothing ever renders blank. makeItem gained an `art` field. Three sample themes drawn (forge: molten/riveted; pixel: blocky/retro; void: fractured shards), each a draw(icon,color) fn keyed by slot. Wired into the character sheet slots, inventory, slot detail and the Expedition result. The other 5 planet themes fall back to the icon until drawn. Owner wants BOTH his images and my SVG art \u2014 this supports both.","PHASE 11.x \u2014 CONSUMABLE BOOSTS. A new loot category beside gear: bottles/pills/shards you use for a TEMPORARY stat lift, then they're gone. Five kinds (idle, offline, Credit-find, tap, luck), strength+duration by rarity (common x1.25/10m ... mythic x8/60m). Expeditions drop a boost instead of gear ~40% of the time, sharing the same rarity roll so deep planets give stronger boosts. useBoost moves it from inventory to activeBoosts; computeStats reads them LIVE and multiplies the matching stat, dropping expired ones; same-kind boosts stack (product). Credit boost lifts Expedition payout, luck boost raises drop chance. Boosts survive Reboot. Character sheet shows active boosts + a Use action; the Expedition result shows BOOST FOUND. Measured: x3 idle boost triples dps, two stack to 4x, expired ones inert.","PHASE 11.x \u2014 PER-PLANET LOOT. Loot is no longer generic: each planet has its own lootProfile so travelling somewhere new gives DIFFERENT gear, which is what makes distance matter. The distance band still sets the CEILING (how good), the planet sets the FLAVOUR: slotBias weights which slots drop (The Forge favours weapons, Glass Ocean favours neck/rings, Void Terminal favours vehicles+weapons) and rarityTilt nudges the odds up or down within the band. Every drop carries the planet's `theme` (neon/forge/glass/void/...) \u2014 the hook for step 2, themed gear ART. Measured: three planets, three distinct slot/theme/rarity profiles. Foundation of 'loot must be distinct per planet'.","PHASE 11.x \u2014 EXPEDITION CATALOGUE. Because you can only launch from the planet you stand on, remembering what hundreds of expeditions offer was impossible. The Available tab now shows the local (launchable) missions at the top, and below them a browse-only accordion of every OTHER discovered planet: tap a planet name to expand its expeditions (tier, duration, Credits, Data), tap again to collapse. You can SEE everything to plan where to travel, but still only LAUNCH what is local. Solves the memory problem without breaking the travel-matters rule.","PHASE 11.x \u2014 EXPEDITIONS ARE LOCAL, AND CAN BE RUSHED. (1) You can now only take on Expeditions hosted by the planet you are STANDING on \u2014 not every planet you have ever discovered. missionVisible checks current location, not the discovered set. This makes travel matter: to run a planet's missions you must be there. The now-redundant server filter was removed. (2) A running Expedition can be finished instantly for CREDITS. Cost = ceil(maxReward * 2.0 * fractionOfTimeLeft), so it is always at least 2x what the run pays (never a profit loop) yet cheap once the run is nearly done \u2014 180 Cr to skip an 8h run from the start, 18 Cr in the last 10%. Rushing only brings the finish forward; the result is rolled at claim exactly as if it ended on its own, so odds are unchanged.","PHASE 11.x \u2014 SAVE RELIABILITY. Owner reported progress always resets to zero. Two fixes: (1) SaveAdapter.available is now a LIVE getter, not a value read once at module load \u2014 if the host injects window.storage a moment after this script runs, a one-time read would latch 'unavailable' forever and the game would save only to memory, losing everything on close. (2) A clear up-front warning now fires at boot if there is no persistent storage at all, pointing the player to Export. NOTE: a single-file artifact fundamentally cannot guarantee cross-session persistence \u2014 window.storage is tied to the artifact instance, and a fresh instance (e.g. new conversation) starts empty. Export/Import is the reliable path until the game leaves the artifact format (Phase 13, Supabase).","PHASE 11 (step 3) \u2014 ITEM DROPS. Expeditions can now drop a real item, and the character sheet starts filling. Drop chance scales with mission tier (6/10/16/24%), only on success/partial, never on failure. Rarity is bounded by the host planet's distance band: the Hub drops wooden-sword commons, the deep Outer Signal drops up to legendary, and mythic stays reserved for the galaxies of Phase 12. Names are composed (rarity prefix + slot noun) \u2014 the seed of the thousands-of-items pipeline. A drop lands in inventory (never auto-equipped) and shows in the Expedition result as an ITEM FOUND card. Empty gear slots also brightened for visibility per owner feedback. Next: the per-planet manual minigame.","PHASE 11 (step 2) \u2014 CHARACTER SHEET. Tapping your Explorer opens a Character tab: a big figure with 11 MMO gear slots down each side (helmet/neck/armor/legs/boots on the left; main-hand/off-hand/belt/two rings on the right; vehicle under the figure), a total Combat Power readout, and an inventory list. Tap a slot to see what is worn and equip/unequip; tap an inventory item to wear it. Empty slots read as dashed placeholders \u2014 the frame is there from day one even though almost everything is empty. Mobile-first (two flanking columns), scales up on desktop. equipItem/unequipItem never destroy \u2014 equipped just points at inventory; a ring auto-picks a free finger. GearSlotGlyph draws each slot icon. debugGrantItem seeds items for testing. Next: real drops from Expeditions.","PHASE 11 (step 1) \u2014 ITEM DATA MODEL. Items are RPG loot, not idle buffs: every item carries Combat Power and an Item Level, an optional effect (passive / consumable / cooldown), and provenance for server-authority later. Power and i-level scale by rarity AND by how far from home it was found (wooden sword near start, relic 200 planets out). Some items have no stats \u2014 trophies you hold until needed. State gains inventory + 11 MMO gear slots (head/neck/chest/legs/boots/belt/mainHand/offHand/ring1/ring2/vehicle), both surviving Reboot. Save v12. NOTHING is generated, dropped or shown yet \u2014 this is the shape only. Next: the character sheet.","PHASE 10.2 \u2014 CREDITS: the premium currency arrives (save v11). Travel is now paid in Credits, not Data \u2014 Data floods in and made distance free, Credits come in lumps from Expeditions and stay scarce, so a far trip is a campaign you grind for. The free ride home is GONE: if you cannot afford the fare you stay and earn it via Expeditions (never permanently stranded \u2014 your factory keeps producing and Expeditions always pay). travel.baseCost rescaled 250->3 (~80x) for the Credits scale: fare home is ~1 run from Glass Ocean, ~26 from Void Terminal. Credits survive Reboot like the collection. Step 3 of the roadmap.","PHASE 10.1 \u2014 The Data Core only lives on a producing planet now. tap() returns nothing on a junction/relay/anomaly (authoritative gate), and the Core is replaced by a quiet 'in transit' state so there is no dead button to press. Idle factory production keeps ticking wherever you stand \u2014 you are never cut off from income, only from tapping on a transit node. Step 2 of the CREDITS roadmap.","PHASE 10.1 \u2014 VOCABULARY: the 16 places are now 'planets' in every player-facing string; the word 'server' is reserved for the galaxy level coming in Phase 12. Only display text changed \u2014 ids (server1/server3/hidden objectives), variable names (g.servers, SERVER_*), and save keys are all untouched, so the objective chain and saves are unaffected. Step 1 of the CREDITS roadmap; see notes \xA710.","PHASE 10 \u2014 Map milestones moved off the Servers tab into a modal under Systems, beside Achievements (they are the same kind of thing: one-time reward for a one-time feat). The Servers tab is now only the map and travel \u2014 nothing else.","PHASE 10 \u2014 Map froze after selecting a Server, unlocking a world, or returning to the tab. Its pan/zoom lived in NetworkMap's own useState, which reset on every re-render of ServersScreen, and the non-passive touchmove listener was pinned to []-deps so it went stale when the SVG re-created. View state now lives in a ref on the parent screen (survives all re-renders); the listener attaches via a ref callback so it re-binds to the live element. The map now behaves identically the 1st time and the 100th.","PHASE 10 \u2014 Map drag-down closed the whole artifact: the Claude host container reads a downward drag with nowhere left to scroll as a close gesture. CSS touch-action stops the page scroller but not the host. Added a non-passive touchmove listener on the map SVG that calls preventDefault, keeping the gesture from reaching the host. Verifiable only in the real Claude app.","PHASE 10 \u2014 FIXED (again): dragging the map still scrolled the page. .content has touch-action:pan-y and scrolls natively regardless of JS, so a JS swipe guard can never win \u2014 the scroller is now locked in CSS (a class toggled on pointerdown) while a finger is on the map.","PHASE 10 \u2014 FIXED: the capsule-reveal rays were 460px and centred on the viewport (left:50%), so the flare shot off across the screen. They are now bound to the Echo card with a masked ring and a single glint that slowly orbits it.","PHASE 10 \u2014 FIXED: the map had touch-action only on the <svg>, so a vertical drag fell through to the page scroller and it could not be panned with a thumb. It belongs on the wrapper.","PHASE 10 \u2014 The Network map IS the Servers tab now: 68vh, a parallax starfield at three depths, double-tap and wheel zoom, bigger controls, and a zoom readout.","PHASE 10 \u2014 Extraction gained the visibility it always lacked: one plain reminder before Reboot, never blocking, never repeated.","PHASE 9 \u2014 FIXED: MissionGlyph was referenced at 7 call sites and never defined, which crashed the Expeditions tab on render. EXPEDITION_ART now exists, with a distinct glyph per mission.","PHASE 8 \u2014 Live Events: one global event per 72h rotation, forever, no backend","PHASE 8 \u2014 Rotation is a pure function of UTC epoch time, immune to timezone and DST","PHASE 8 \u2014 Rotation is MONOTONIC: a backwards clock can never rewind or re-open an event","PHASE 8 \u2014 Milestones are earned by playing, not by waiting, so a forward clock grants nothing","PHASE 8 \u2014 6 events reusing existing modifier surfaces only. No parallel gameplay.","PHASE 8 \u2014 Fragment Bloom revives Neon Hub; Arcade Revival revives Arcade-87","PHASE 8 \u2014 Temporary objectives beside the permanent chain, never inside it","PHASE 8 \u2014 Event progress survives Reboot, so the two systems never fight","PHASE 8 \u2014 Event Index, 6 achievements, save migration v7 -> v8, full event debug suite"],futureSystems:["Cosmetics and Explorer customisation","Player-built routes and dynamic route destruction","Dynamic anomalies, additional Regions, additional FULL SERVERS","Quests, trading, leaderboards, multiplayer presence","Backend map authority and cloud saves","Guilds and social features","Timed capsule decryption (Decrypt Speed becomes a timer reduction)","Reboot (prestige) across the discovered Network","Expedition cancellation, dynamic mission rotation, Echo injury","Server hazards, corruption pressure, deeper Server tiers","Events, cosmetics, quests, loot discoveries","Cloud saves + server-authoritative economy, push notifications"],knownLimitations:["TEST HARNESS \u2014 the logic suites stub React and never mount a component, so no amount of green there can prove a screen renders. A separate render smoke test (react-dom/server) now covers every glyph. Add to it whenever a component is added.","PHASE 9 \u2014 Travel is instant. There are no travel timers: distance and cost already create the decision, and a timer would only duplicate Expedition waiting.","PHASE 9 \u2014 There is no fuel and no sixth currency. Data pays for travel because travel is a run-level logistics decision.","PHASE 9 \u2014 The map is authored, not procedural. 16 places, 24 routes, fixed coordinates.","PHASE 9 \u2014 No route combat, no player-built routes, no route destruction, no backend map sync, no multiplayer presence.","PHASE 9 \u2014 Waypoints, Relays and Anomalies carry no Capsule, no Echo pool and no Expedition. That content weight stays with FULL SERVERS.","PHASE 9 \u2014 Only the current FULL SERVER has Connection. It is not stored per Server, and it does not travel with you.","PHASE 9 \u2014 Standing on a lightweight place gives the neutral Neon Hub baseline. A Waypoint is somewhere to pass through, not somewhere to farm.","XP comes only from Expeditions. Tapping, idle, buildings and capsules grant no Echo XP, by design.","An Echo at its level cap earns no further XP. Excess is discarded rather than banked.","Echo level scales ability effectiveness (including Expedition Gain). It does NOT change Expedition success chance, which stays driven by rarity and ability tiers.","Fusion materials must match the target's species AND rarity. There is no cross-species fusion.","Extraction destroys the source Echo permanently. There is no way to recover it.","An Ability Imprint carries only type, tier and origin. Level, XP and history never transfer.","Installing an Imprint consumes it. One use, no copying, no refunds.","Install can never raise an Echo's ability count and can never create a duplicate ability.","Mutation acts only on stored Imprints. There is no direct Echo mutation and no ability-slot expansion.","Mutation Count never resets in normal play. There is no pity system, no insurance and no undo.","An Imprint is capped at 8 mutation attempts. After that it stays usable but can never be mutated again.","Fusion grants XP only. It never raises rarity, rerolls abilities or adds ability slots.","Decrypt Speed gives a Code Fragment refund chance and counts as a recommended Expedition ability. It does not reduce any timer.","Expeditions cannot be recalled once launched. Mission list is fixed; no rotation, no live events.","Code Fragments are one flat resource. Mission tables authored in Uncommon/Rare/Epic Fragments are folded into Common at 4x / 12x / 30x.","Scan cost doubles per scan and is capped at 2^12 so late scanning stays reachable.","Sky Array can push offline rate above 100% of live production. Intentional.","Events run on a fixed rotation. There is no backend, so a determined player can move their device clock to choose which event is live. They gain nothing by it: every milestone is earned by playing.","Missing an event costs nothing. Events only ever add.","No push notifications, no backend validation.","Save lives in the artifact's persistent key-value storage, not localStorage."]},i={characterClasses:[{id:"breaker",name:"Breaker",tagline:"Hands on the wire",plain:"You hit harder, and sometimes the wire splits.",detail:"Every tap lands heavier and crits come far more often. Strongest when you are actually holding the phone \u2014 weakest when you are not.",color:"#f472b6",mods:{tap:1.18,critChance:1.5},pvpLater:"Direct damage \u2014 the class that * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* iOS: kill the long-press callout/magnifier and the double-tap zoom gesture.
   touch-action: manipulation keeps scrolling and pinch, but removes the 300ms
   double-tap-to-zoom recogniser. Text inputs opt back into selection below. */
.genesis-root {
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
.genesis-root button, .genesis-root .icard, .genesis-root .pick, .genesis-root .fchip, .genesis-root .navbtn, .genesis-root .seg-btn, .genesis-root .subtab {
  touch-action: manipulation;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
.genesis-root input, .genesis-root textarea, .genesis-root .ta {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}
.genesis-root {
  --navy: #05091a; --panel: rgba(16,26,58,.62); --line: rgba(96,140,220,.18);
  --cyan: #22d3ee; --cyan-soft: #67e8f9; --purple: #a855f7; --gold: #fbbf24;
  --text: #e6edff; --muted: #8ea3c8;
  background: #02040c; display: flex; justify-content: center;
  /* dvh tracks the ACTUAL visible area on iOS, where 100vh wrongly includes the
     address bar and pushes the bottom nav below the screen edge. */
  height: 100vh; height: 100dvh;
  font-family: "Inter", "SF Pro Display", system-ui, -apple-system, sans-serif;
  color: var(--text);
}
.app {
  position: relative; width: 100%; max-width: 430px; height: 100%; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 0 90px rgba(34,211,238,.09);
  transition: background 700ms ease;
}
.bg-grid {
  position: absolute; inset: 0; pointer-events: none; opacity: .3;
  background-size: 34px 34px; mask-image: linear-gradient(180deg, rgba(0,0,0,.7), transparent 55%);
}
.scanlines { position: absolute; inset: 0; pointer-events: none; opacity: .06;
  background: repeating-linear-gradient(180deg, #fff 0 1px, transparent 1px 3px); }
.reduced .scanlines { display: none; }

.boot { align-items: center; justify-content: center; background: linear-gradient(180deg, #070d24, #030612); }
.boot-inner { text-align: center; }
.boot-text { margin-top: 18px; letter-spacing: .22em; font-size: 11px; color: var(--cyan); font-weight: 700; }

.hud { flex: 0 0 auto; z-index: 20; padding: 10px 12px 8px;
  background: linear-gradient(180deg, rgba(5,9,26,.98), rgba(5,9,26,.82) 70%, rgba(5,9,26,.5)); }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rank { display: flex; align-items: center; gap: 8px; min-width: 0; }
.rank { background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; }
.rank:active { transform: scale(.96); }
.avatar-wrap { position: relative; width: 40px; height: 40px; min-width: 40px; border-radius: 12px; border: 1px solid;
  display: grid; place-items: center; overflow: visible; }
.avatar-lv { position: absolute; bottom: -4px; right: -4px; min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
  display: grid; place-items: center; font-size: 9px; font-weight: 900; color: #06111f; box-shadow: 0 0 8px rgba(0,0,0,.5); }
.rank-next { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #fbbf240e; border: 1px solid #fbbf2433; font-size: 11px; color: #cbd5e1; }
.rank-next b { color: #fbbf24; }
.hud-name { font-weight: 800; font-size: 14px; color: #f1f5f9; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
.hud-band { font-size: 10px; font-weight: 700; letter-spacing: .3px; line-height: 1.2; }
.rank-meta { display: flex; flex-direction: column; gap: 2px; width: 120px; text-align: left; }
.rank-meta span { font-size: 9px; letter-spacing: .14em; font-weight: 800; text-transform: uppercase; }

/* Profile */
.profile { text-align: center; }
.prof-hero { display: grid; place-items: center; padding: 10px; border-radius: 18px; margin-bottom: 10px; }
.prof-name { width: 100%; text-align: center; background: rgba(255,255,255,.04); border: 1px solid var(--line);
  border-radius: 12px; color: var(--text); font-family: inherit; font-size: 19px; font-weight: 800; padding: 10px; min-height: 46px; }
.prof-name:focus { outline: none; border-color: rgba(34,211,238,.6); background: rgba(34,211,238,.08); }
.prof-band { display: inline-block; border: 1px solid; border-radius: 99px; padding: 5px 16px; font-size: 12px;
  font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.prof-xp { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: rgba(255,255,255,.02); text-align: left; }
.prof-team { display: flex; justify-content: center; gap: 8px; margin-bottom: 6px; }
.ladder { display: flex; flex-direction: column; gap: 4px; text-align: left; }
.ladder-row { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border: 1px solid; border-radius: 12px;
  background: rgba(255,255,255,.02); }
.ladder-row.on { background: rgba(255,255,255,.05); }
.ladder-av { display: grid; place-items: center; }
.ladder-row > div { flex: 1; }
.ladder-now { font-size: 9px; font-weight: 900; letter-spacing: .16em; }
.hud-currencies { display: flex; align-items: center; gap: 6px; }
.cur { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 9px; border: 1px solid var(--line); background: rgba(10,18,48,.7);
  white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; font-family: inherit; min-height: 40px;
  justify-content: center; }
.cur:active { transform: scale(.94); }
.cur-val { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.cur-lbl { font-size: 7.5px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; font-weight: 700; }
.intro { border-color: rgba(168,85,247,.35); background: rgba(168,85,247,.07); }
.cur-explain { border: 1px solid; border-radius: 11px; padding: 9px 10px; font-size: 11px; line-height: 1.5;
  color: var(--muted); text-align: left; margin-bottom: 10px; }
.cur-frag { color: var(--purple); border-color: rgba(168,85,247,.32); }
.cur-credits { border-color: #fbbf2455; }
.cur-credits .cur-val { color: #fbbf24; }
.cur-prism { color: var(--gold); border-color: rgba(251,191,36,.32); }
.gear { width: 34px; height: 34px; min-width: 34px; border-radius: 10px; border: 1px solid var(--line); background: rgba(10,18,48,.7); color: var(--muted); font-size: 15px; cursor: pointer; }
.gear:active { transform: scale(.94); }
.hud-data { display: flex; align-items: baseline; justify-content: center; gap: 8px; margin-top: 6px; }
.data-total { font-size: 30px; font-weight: 800; letter-spacing: -.02em; color: #fff; text-shadow: 0 0 22px rgba(34,211,238,.5); font-variant-numeric: tabular-nums; }
.data-label { font-size: 10px; letter-spacing: .2em; color: var(--cyan); font-weight: 700; }
.data-rate { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--cyan-soft); background: rgba(34,211,238,.1); border: 1px solid rgba(34,211,238,.25); padding: 3px 8px; border-radius: 8px; font-variant-numeric: tabular-nums; }

.content { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; z-index: 2;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
/* While a finger is dragging the map, the page scroller must not move. Native scrolling
   only yields to native CSS, so this is the actual fix \u2014 the JS guard alone cannot win. */
.content.no-native-scroll { overflow: hidden; touch-action: none; }
@keyframes slideLK { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
@keyframes slideRK { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }
.slide-l { animation: slideLK .2s ease-out; }
.slide-r { animation: slideRK .2s ease-out; }
.reduced .slide-l, .reduced .slide-r { animation: none; }
.nav-dots { flex: 0 0 auto; display: flex; justify-content: center; gap: 4px; padding: 3px 0 3px; z-index: 20;
  background: linear-gradient(0deg, rgba(4,7,20,.98), rgba(4,7,20,.7)); }
.nav-dot { width: 14px; height: 3px; border-radius: 2px; background: rgba(96,140,220,.25); transition: background .2s, width .2s; }

/* The Core itself is a button, not scenery. touch-action:none stops the browser

@keyframes spin { to { transform: rotate(360deg); } }

.core-ring-slow { animation: spin 26s linear infinite; }

@keyframes sparkle { 0%{opacity:.6} 50%{opacity:1} 100%{opacity:.6} }

/* Numbers fly out of the Core along --fx/--fy, so the thumb never covers them. */
.float { position: absolute; left: 50%; top: 46%; pointer-events: none; white-space: nowrap; text-align: center;
  display: flex; flex-direction: column; align-items: center; line-height: 1.1;
  font-weight: 800; font-size: 16px; color: var(--cyan-soft); text-shadow: 0 0 12px rgba(34,211,238,.85);
  animation: floatOut .9s cubic-bezier(.15,.7,.3,1) forwards; }
.float em { color: var(--purple); font-style: normal; font-size: 11px; font-weight: 800; text-shadow: 0 0 10px rgba(168,85,247,.9); }

/* Idle numbers: present but quieter, so a tap always reads louder than the machines. */
.float-idle { font-size: 12px; font-weight: 700; opacity: .72; text-shadow: 0 0 8px currentColor; }
.float-idle em { font-size: 11px; opacity: .95; }
@keyframes floatOut {

  18%  { opacity: 1; transform: translate(calc(-50% + var(--fx) * .22), calc(-50% + var(--fy) * .22)) scale(1.18); }
  70%  { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--fx)), calc(-50% + var(--fy))) scale(.92); }
}
/* Crit: bigger, gold, slower, and it announces itself. */
.float-crit { font-size: 26px; color: var(--gold); text-shadow: 0 0 20px rgba(251,191,36,1), 0 0 40px rgba(251,191,36,.5);
  animation: floatOutCrit 1.15s cubic-bezier(.12,.75,.25,1) forwards; }

  26%  { transform: translate(calc(-50% + var(--fx) * .3), calc(-50% + var(--fy) * .3)) scale(1.12); }
  75%  { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--fx)), calc(-50% + var(--fy))) scale(1); }
}
.crit-ring { position: absolute; left: 50%; top: 46%; width: 150px; height: 150px; margin: -75px 0 0 -75px;
  border-radius: 50%; border: 3px solid var(--gold); pointer-events: none;

  animation: critRingK .62s cubic-bezier(.15,.75,.3,1) forwards; }

@keyframes critRingK { 0% { transform: scale(.3); opacity: .95; } 100% { transform: scale(2.3); opacity: 0; } }
.crit-shard { position: absolute; left: 50%; top: 46%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 2px;
  background: var(--gold); pointer-events: none; box-shadow: 0 0 12px var(--gold);
  animation: critShardK .66s cubic-bezier(.15,.7,.3,1) forwards; }
@keyframes critShardK {

/* Mutation */

@keyframes crackK { 0%,100%{opacity:.25} 50%{opacity:.6} }

  animation: crackK 2.4s ease-in-out infinite; }

.imprint { position: relative; }

@keyframes cycleK { 0%{opacity:.2;transform:scale(.9)} 50%{opacity:1;transform:scale(1.08)} 100%{opacity:.2;transform:scale(.9)} }
.type-cycle { animation: cycleK .35s linear infinite; }

.ms-panel, .th-panel, .cube-panel { display:flex; flex-direction:column; gap:4px; }
.ms-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #14203a; }
.ms-main { flex:1; min-width:0; }
.ms-name { font-size:13px; font-weight:700; color:#e2e8f0; }
.ms-reward { font-size:11px; color:#fbbf24; margin-top:2px; }
.ms-ready .ms-name { color:#fbbf24; }
.ms-done { opacity:.5; }
.ms-tick { color:#34d399; font-size:16px; font-weight:800; }
.ms-lock { color:#334155; }
.th-row { display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:11px; border-bottom:1px solid #14203a; }
.th-route { color:#94a3b8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.th-cost { font-weight:700; flex:0 0 auto; }

@media (max-width: 380px) {
  .mapwrap { height:52vh; min-height:270px; }
  .mapwrap-tall { height:62vh; }
  .mapctl button { width:38px; height:38px; font-size:16px; }
  .ms-reward { font-size:10px; }
}
@media (prefers-reduced-motion: reduce) {
  .route-pulse, .conn-aura { animation:none; }
}
